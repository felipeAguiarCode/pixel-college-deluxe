  hub() {
    const c = career();
    if (!c) return SCREENS.title();
    const t = getTeam(c.teamId);
    const rank = rankOf(c);
    const conf = CONF_BY_ID.get(t.conf);
    const confRank = confRankOf(c);
    const avail = c.roster.filter(isAvailable).length;
    const done = c.goals.filter((g) => g.status === 'done').length;
    const tiles = [
      ['roster', 'ELENCO', `${c.roster.length}/${MAX_ROSTER} · ${avail} aptos`], ['recruit', 'RECRUTAR', money(c.scholarship)],
      ['facilities', 'ESTRUTURA', `${c.cc} CC`], ['league', 'LIGA', t.conf === 'ind' ? `#${rank} no país` : `${confRank}º na ${conf.short}`],
      ['goals', 'METAS', `${done}/3 cumpridas`], ['legacy', 'LEGADO', `${c.history.length} ${plural(c.history.length, 'temporada', 'temporadas')}`],
      ['editor', 'EDITOR', 'Times e elenco'], ['settings', 'OPÇÕES', 'Som, save, regras'],
    ];
    const hero = c.fired || c.event ? 'assets/menu/mode-career.webp' : c.phase === 'offseason' ? 'assets/menu/mode-championship.webp' : 'assets/loading/loading-tunnel.webp';
    return `<section class="screen hub-screen">
      ${screenHead('CENTRAL DA CARREIRA', { back: false, right: '<button class="btn ghost small" data-action="hub-go" data-to="title">MENU PRINCIPAL</button>' })}
      <header class="hub-bar box" style="${teamTheme(t)}">
        ${crest(t, 'lg')}
        <div class="hub-id"><span class="eyebrow">${esc(t.city)} · ${esc(conf.name)} · TEMPORADA ${c.season}</span><h2>${esc(fullName(t))}</h2><p>Treinador ${esc(c.coachName)}</p></div>
        <div class="hub-stats"><div><b>${c.record.wins}-${c.record.losses}</b><small>CAMPANHA</small></div><div><b>#${rank}</b><small>RANKING</small></div><div><b>${c.cc}</b><small>CC</small></div><div><b>${money(c.scholarship)}</b><small>BOLSAS</small></div></div>
        <div class="hub-conf">${confidenceMeter(c.confidence)}</div>
      </header>
      <div class="hub-main">
        <section class="box hub-next"><img class="hub-card-art" src="${hero}" alt="">${hubNext(c, t)}</section>
        <nav class="hub-tiles">${tiles.map(([id, label, sub]) => `<button class="hub-card" data-action="hub-go" data-to="${id}"><img class="hub-card-art" src="assets/menu/hub-${id}.webp" alt=""><span class="hub-card-copy"><b>${label}</b><small>${esc(sub)}</small></span></button>`).join('')}</nav>
      </div>
      <p class="hub-news">${esc(c.lastNotice || '')}</p>
    </section>`;
  },

  goals() {
    const c = career();
    const views = c.goals.map((g) => goalView(c, g));
    return `<section class="screen">${screenHead(`METAS · TEMPORADA ${c.season}`)}
      <div class="split">
        <div class="goal-list">${views.map(goalCard).join('')}</div>
        <div class="box">
          ${confidenceMeter(c.confidence)}
          <ul class="rules plain">
            <li><b class="good">+12</b> por meta cumprida</li><li><b class="bad">-15</b> por meta não alcançada</li>
            <li><b class="good">+15</b> pelo título nacional · <b class="good">+6</b> pelo playoff · <b class="good">+4</b> pelo título da conferência</li><li><b class="bad">-8</b> por campanha negativa</li>
            <li>Com confiança <b class="bad">0</b>, a diretoria demite o treinador.</li>
          </ul>
          <p class="muted">Metas de volume pagam a recompensa assim que são cumpridas. Metas de limite e de porcentagem são avaliadas no fim da temporada. Partidas simuladas também contam.</p>
        </div>
      </div></section>`;
  },

  roster() {
    const c = career();
    const t = getTeam(c.teamId);
    const st = teamStrength(c);
    const rows = c.roster.map((p) => `<tr class="${p.benched ? 'benched' : ''}">
      <td><div class="athlete">${portrait(p, t)}<span><strong>#${p.number} ${esc(p.name)}</strong><small><b class="pill">${p.position}</b> ${YEAR_NAMES[p.year - 1]}${p.injury ? ` · <em class="bad">LESÃO ${p.injury}J</em>` : p.gpa < 2 ? ' · <em class="bad">SUSPENSO</em>' : p.benched ? ' · BANCO' : ''}</small></span></div></td>
      <td>${starsHtml(p.rating)}<small class="muted">pot. ${p.potential.toFixed(1)}</small></td>
      <td><span class="${p.gpa < 2 ? 'bad' : ''}">${p.gpa.toFixed(1).replace('.', ',')}</span></td>
      <td>${Math.round(p.condition)}%${bar(p.condition / 100, 'thin')}</td>
      <td><div class="row-actions"><button class="btn small ghost" data-action="bench" data-id="${p.id}">${p.benched ? 'ESCALAR' : 'BANCO'}</button><button class="btn small" data-action="tutor" data-id="${p.id}" ${c.cc < COSTS.tutor ? 'disabled' : ''}>TUTOR ${COSTS.tutor}CC</button><button class="btn small danger" data-action="release" data-id="${p.id}" aria-label="Dispensar ${esc(p.name)}">×</button></div></td>
    </tr>`).join('');
    return `<section class="screen">${screenHead('ELENCO', { right: `<span class="chip">ATAQUE ${starsHtml(st.offense)}</span><span class="chip">DEFESA ${starsHtml(st.defense)}</span>` })}
      <div class="box">
        <div class="wallet"><b>${c.roster.length}/${MAX_ROSTER} ATLETAS</b><span>${c.roster.filter(isAvailable).length} disponíveis</span><b>${c.cc} CC</b></div>
        <div class="table-scroll"><table class="table"><thead><tr><th>ATLETA</th><th>FORÇA</th><th>GPA</th><th>ENERGIA</th><th>AÇÕES</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="training"><span>Ritmo de treino</span><div class="seg">${[['light', 'LEVE'], ['normal', 'NORMAL'], ['hard', 'INTENSO']].map(([k, l]) => `<button class="btn small ${c.training === k ? 'primary' : 'ghost'}" data-action="training" data-plan="${k}">${l}</button>`).join('')}</div></div>
        <p class="muted">GPA abaixo de 2,0 suspende o atleta. O banco recupera condição e notas. Treino intenso dá mais XP e desgasta mais.</p>
      </div></section>`;
  },

  recruit() {
    const c = career();
    const t = getTeam(c.teamId);
    const list = c.recruits.filter((r) => !r.recruited && (app.recruitFilter === 'all' || r.position === app.recruitFilter));
    return `<section class="screen">${screenHead('RECRUTAMENTO')}
      <div class="box">
        <div class="wallet"><b>${money(c.scholarship)}</b><span>${MAX_ROSTER - c.roster.length} vagas</span>${selectHtml('recruit-filter', [['all', 'Todas as posições'], ...POSITION_LIST.map((p) => [p, p])], app.recruitFilter)}</div>
        <div class="card-grid">${list.map((r) => `<article class="card"><div class="athlete">${portrait(r, t)}<span><strong>${esc(r.name)}</strong><small><b class="pill">${r.position}</b> ${esc(r.hometown)}</small></span></div>
          <div class="card-row">${starsHtml(r.rating)}<small>Potencial ${r.potential.toFixed(1)}</small><small>GPA ${r.gpa.toFixed(1)}</small></div>
          <div class="card-row"><b class="price">${money(r.cost)}</b><button class="btn small primary" data-action="recruit" data-id="${r.id}" ${c.scholarship < r.cost || c.roster.length >= MAX_ROSTER ? 'disabled' : ''}>RECRUTAR</button></div></article>`).join('') || '<p class="muted">Nenhum recruta disponível nesta posição.</p>'}</div>
      </div></section>`;
  },

  facilities() {
    const c = career();
    const info = { stadium: ['ESTÁDIO', 'Mais apoio da torcida e receita a cada partida.'], training: ['CENTRO DE TREINO', 'Mais XP para desenvolver o elenco.'], rehab: ['REABILITAÇÃO', 'Recupera a condição física entre os jogos.'] };
    return `<section class="screen">${screenHead('ESTRUTURA', { right: `<span class="chip">${c.cc} CC</span>` })}
      <div class="card-grid three">${Object.entries(info).map(([k, [name, text]]) => `<article class="box facility"><div class="facility-art">${facilityArt(k)}</div><h3>${name}</h3>
        <div class="levels">${[1, 2, 3, 4, 5].map((i) => `<i class="${c.facilities[k] >= i ? 'on' : ''}"></i>`).join('')}</div><p class="muted">${text}</p>
        <button class="btn ${c.facilities[k] < 5 ? 'primary' : ''} wide" data-action="upgrade" data-key="${k}" ${c.facilities[k] >= 5 || c.cc < upgradeCost(c, k) ? 'disabled' : ''}>${c.facilities[k] >= 5 ? 'NÍVEL MÁXIMO' : `MELHORAR · ${upgradeCost(c, k)} CC`}</button></article>`).join('')}</div>
      <div class="box wallet"><span>Teto do fundo de bolsas: <b>${money(c.scholarshipCap)}</b></span><button class="btn small" data-action="upgrade" data-key="scholarship" ${c.cc < COSTS.scholarshipExpansion || c.scholarshipCap >= 200000 ? 'disabled' : ''}>+ $20.000 · ${COSTS.scholarshipExpansion} CC</button></div>
    </section>`;
  },

  league() {
    const c = career();
    const tabs = [['conf', 'CONFERÊNCIA'], ['top25', 'TOP 25'], ['schedule', 'CALENDÁRIO'], ...(c.playoffSeeds.length ? [['playoff', 'PLAYOFF']] : [])];
    const tab = tabs.some(([k]) => k === app.leagueTab) ? app.leagueTab : 'conf';
    const table = recordTable(c);
    const ranking = nationalRanking(c, table);
    const rankById = new Map(ranking.map((r) => [r.teamId, r.rank]));
    const teamCell = (team, extra = '', showRank = true) => `<span class="team-cell">${crest(team, 'sm')}<span>${showRank ? `<span class="muted">${rankTag(rankById.get(team.id))}</span>` : ''}${esc(team.name)}${extra}</span></span>`;
    let body = '';
    if (tab === 'conf') {
      const conf = app.leagueConf || confOf(c.teamId);
      const rows = conferenceStandings(c, conf, table);
      const ind = conf === 'ind';
      body = `${confTabs('league-conf', conf)}<div class="table-scroll"><table class="table"><thead><tr><th>#</th><th>UNIVERSIDADE</th>${ind ? '' : '<th>CONF.</th>'}<th>GERAL</th><th>PF</th><th>PC</th></tr></thead><tbody>${rows.map((r) => `<tr class="${r.teamId === c.teamId ? 'own' : ''}"><td class="${!ind && r.rank <= 2 ? 'good' : ''}">${pad2(r.rank)}</td><td>${teamCell(r.team)}</td>${ind ? '' : `<td>${r.confWins}-${r.confLosses}</td>`}<td>${r.wins}-${r.losses}</td><td>${r.pf}</td><td>${r.pa}</td></tr>`).join('')}</tbody></table></div>
        <p class="muted">${ind ? 'Independentes não têm final de conferência: a vaga no playoff vem só do ranking.' : 'Os 2 primeiros disputam a final da conferência. Desempate: campanha na conferência, campanha geral e saldo.'}</p>`;
    } else if (tab === 'top25') {
      const mine = ranking.find((r) => r.teamId === c.teamId);
      const row = (r) => `<tr class="${r.teamId === c.teamId ? 'own' : ''}"><td class="${r.rank <= 12 ? 'good' : ''}">${pad2(r.rank)}</td><td>${teamCell(r.team, '', false)}</td><td>${CONF_BY_ID.get(r.team.conf).short}</td><td>${r.wins}-${r.losses}</td><td>${r.pf - r.pa >= 0 ? '+' : ''}${r.pf - r.pa}</td></tr>`;
      body = `<div class="table-scroll"><table class="table"><thead><tr><th>#</th><th>UNIVERSIDADE</th><th>CONF.</th><th>CAMPANHA</th><th>SALDO</th></tr></thead><tbody>${ranking.slice(0, 25).map(row).join('')}${mine.rank > 25 ? `<tr class="gap"><td colspan="5">···</td></tr>${row(mine)}` : ''}</tbody></table></div>
        <p class="muted">Playoff nacional com 12 times: os 5 campeões de conferência mais bem colocados têm vaga garantida e o resto entra pelo ranking. Os 4 primeiros folgam na 1ª rodada.</p>`;
    } else if (tab === 'playoff') {
      const seedOf = (id) => c.playoffSeeds.indexOf(id) + 1;
      const rounds = [['playoff1', '1ª RODADA'], ['quarter', 'QUARTAS DE FINAL'], ['semifinal', 'SEMIFINAIS'], ['final', 'FINAL NACIONAL']];
      const side = (g, id, score) => `<span class="bracket-team ${g.played && winnerOf(g) === id ? 'win' : ''} ${id === c.teamId ? 'mine' : ''}"><small>${seedOf(id)}</small>${crest(getTeam(id), 'sm')}${esc(getTeam(id).short)}<b>${g.played ? score : ''}</b></span>`;
      body = `<div class="bracket">${rounds.map(([st, label]) => { const games = c.schedule.filter((g) => g.stage === st).sort((a, b) => a.slot - b.slot); return `<div class="bracket-round"><div class="eyebrow">${label}</div>${games.length ? games.map((g) => `<div class="bracket-game">${side(g, g.homeId, g.homeScore)}${side(g, g.awayId, g.awayScore)}</div>`).join('') : '<p class="muted">A definir</p>'}</div>`; }).join('')}</div>
        <p class="muted">Folgam na 1ª rodada: ${c.playoffSeeds.slice(0, 4).map((id, i) => `#${i + 1} ${esc(getTeam(id).name)}`).join(' · ')}</p>`;
    } else {
      body = `<div class="table-scroll"><table class="table"><thead><tr><th>RODADA</th><th>ADVERSÁRIO</th><th>RESULTADO</th></tr></thead><tbody>${c.schedule.filter((g) => isMine(c, g)).map((g) => {
        const home = g.homeId === c.teamId, opp = getTeam(home ? g.awayId : g.homeId);
        const my = home ? g.homeScore : g.awayScore, their = home ? g.awayScore : g.homeScore;
        const where = g.neutral ? '<span class="muted">vs</span>' : home ? '<span class="muted">vs</span>' : '<span class="muted">@</span>';
        const tag = isConfGame(g) ? ' <em class="tag">CONF</em>' : g.stage === 'bowl' ? ` <em class="tag">${esc(g.bowlName)}</em>` : '';
        return `<tr class="${!g.played && g.week === c.week ? 'own' : ''}"><td>${stageShort(g)}</td><td>${where} ${teamCell(opp, tag)}</td><td>${g.played ? `<b class="${winnerOf(g) === c.teamId ? 'good' : 'bad'}">${winnerOf(g) === c.teamId ? 'V' : 'D'} ${my}-${their}</b>` : '—'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    const team = getTeam(c.teamId);
    return `<section class="screen league-screen">${screenHead(`LIGA · ${c.season}`)}
      <div class="league-console">
        <aside class="league-sidebar">
          <div class="league-program" style="${teamTheme(team)}">${crest(team, 'lg')}<h3>${esc(team.name)}</h3>
            <div class="league-record"><span><b>${c.record.wins}-${c.record.losses}</b>CAMPANHA</span><span><b>#${rankById.get(c.teamId)}</b>RANKING</span></div>
          </div>
          <nav class="league-tabs" aria-label="Liga">${tabs.map(([k, l]) => `<button data-action="league-tab" data-tab="${k}" aria-pressed="${tab === k}">${l}<b aria-hidden="true">›</b></button>`).join('')}</nav>
        </aside>
        <div class="league-board">${body}</div>
      </div>
    </section>`;
  },

  legacy() {
    const c = career();
    const t = getTeam(c.teamId);
    return `<section class="screen">${screenHead('LEGADO')}
      <div class="box">${c.history.length ? `<table class="table"><thead><tr><th>ANO</th><th>PROGRAMA</th><th>CAMPANHA</th><th>RANKING</th><th>CONF.</th><th>METAS</th><th>CAMPEÃO NACIONAL</th></tr></thead><tbody>${c.history.map((h) => `<tr class="${h.champion ? 'own' : ''}"><td>${h.season}</td><td>${esc(getTeam(h.teamId).short)}</td><td>${h.wins}–${h.losses}</td><td>${h.champion ? '★ 1' : `#${h.rank}`}${h.playoff && !h.champion ? ' <em class="tag">PLAYOFF</em>' : ''}</td><td>${h.confRank ? `${h.confRank}º ${CONF_BY_ID.get(h.conf)?.short || ''}` : '—'}</td><td>${h.goalsDone ?? '—'}/3</td><td>${esc(getTeam(h.championId).name)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">As páginas ainda estão em branco. Complete uma temporada para registrar a primeira campanha.</p>'}
      ${c.firedHistory.length ? `<p class="muted">Demissões: ${c.firedHistory.map((f) => `${esc(getTeam(f.teamId).short)} (${f.season})`).join(', ')}</p>` : ''}</div>
      ${c.yearbook.length ? `<div class="box"><div class="eyebrow">QUEM JÁ VESTIU A CAMISA</div><div class="card-grid">${c.yearbook.slice(-12).reverse().map((p) => `<article class="card"><div class="athlete">${portrait(p, t)}<span><strong>${esc(p.name)}</strong><small><b class="pill">${p.position}</b> ${esc(p.reason || 'Formado')} · ${p.leftSeason || ''}</small></span></div>${starsHtml(p.rating)}</article>`).join('')}</div></div>` : ''}
    </section>`;
  },

  quick(watch = false) {
    const q = watch ? app.watchSetup : app.quick;
    const side = (key, label) => {
      const t = getTeam(q[key]);
      const randomLabel = watch ? 'Sortear equipe' : key === 'home' ? 'Sortear seu time' : 'Sortear o rival';
      return `<div class="box quick-side" style="${teamTheme(t)}">
        <div class="quick-stage"><span class="quick-stage-role eyebrow">${label}</span><span class="quick-stage-rating"><b>${Math.round(t.power * 20)}</b>FORÇA</span>
          <button class="btn ghost small" data-action="quick-cycle" data-side="${key}" data-dir="-1" aria-label="Anterior">&lt;</button>
          <div class="quick-art"><canvas class="quick-helmet" data-helmet="${t.id}" data-face="${key === 'away' ? 1 : 0}" aria-hidden="true"></canvas></div>
          <button class="btn ghost small" data-action="quick-cycle" data-side="${key}" data-dir="1" aria-label="Próximo">&gt;</button></div>
        <div class="quick-side-info"><div class="quick-team-name">${crest(t)}<h3>${esc(fullName(t))}</h3></div><p class="muted">${esc(t.city)} · ${esc(CONF_BY_ID.get(t.conf).name)}</p>${starsHtml(t.power)}
          <div class="quick-select">${teamSelect(`quick-${key}`, q[key])}<button class="btn ghost small" data-action="quick-random" data-side="${key}" aria-label="${randomLabel}" title="${randomLabel}"><span class="dice-face" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button></div></div></div>`;
    };
    return `<section class="screen quick-screen">${screenHead(watch ? 'ASSISTIR PARTIDA' : 'JOGO RÁPIDO')}
      <div class="quick-grid">${side('home', watch ? 'MANDANTE' : 'SEU TIME')}<div class="vs-big">VS</div>${side('away', watch ? 'VISITANTE' : 'RIVAL')}</div>
      <div class="box quick-opts">
        ${watch ? `<label class="field"><span>VELOCIDADE</span>${selectHtml('watch-speed', WATCH_SPEEDS.map((speed) => [speed, `${speed}×`]), q.speed)}</label>`
          : `<label class="field"><span>DIFICULDADE</span>${selectHtml('quick-diff', difficultyOptions(), q.difficulty)}</label>`}
        <label class="field"><span>DURAÇÃO</span>${selectHtml('quick-quarter', quarterOptions(), q.quarterSeconds)}</label>
        <label class="field"><span>CLIMA</span>${selectHtml('quick-weather', weatherOptions, q.weather)}</label>
        <button class="btn primary big" data-action="${watch ? 'watch-start' : 'quick-start'}" ${q.home === q.away ? 'disabled' : ''}>${watch ? 'INICIAR TRANSMISSÃO' : 'JOGAR'}</button>
      </div>
    </section>`;
  },
  watch() { return SCREENS.quick(true); },

  editor() {

const TITLE_ART = ['assets/menu/menu-street.webp', 'assets/loading/loading-street.webp', 'assets/loading/loading-tunnel.webp'];
let titleArtTimer;
const AFTER = {
  title() {
    const scenes = $$('[data-title-scene]');
    let current = 0;
    titleArtTimer = setInterval(() => {
      if (document.hidden) return;
      const next = (current + 1) % scenes.length;
      if (!scenes[next].complete || !scenes[next].naturalWidth) return;
      const previous = scenes[current];
      previous.style.zIndex = '-3';
      scenes[next].style.zIndex = '-2';
      scenes[next].classList.add('is-active');
      setTimeout(() => previous.classList.remove('is-active'), 700);
      current = next;
    }, 7000);
  },
  challenges() {
    drawChallengeHelmets();
    if (!teamLogoAtlas.complete) teamLogoAtlas.addEventListener('load', drawChallengeHelmets, { once: true });
  },
  newCareer() {
    paintCareerHelmet();
    if (!teamLogoAtlas.complete) teamLogoAtlas.addEventListener('load', paintCareerHelmet, { once: true });
    const list = $('#nc-schools'), row = list.querySelector('[aria-pressed=true]');
    if (row) list.scrollTop = Math.max(0, row.offsetTop + row.offsetHeight - list.clientHeight);
  },
  quick() {
    const draw = () => $$('canvas[data-helmet]').forEach((cv) => drawHelmetPreview(cv, getTeam(cv.dataset.helmet), cv.dataset.face === '1'));
    draw();
    if (!teamLogoAtlas.complete) teamLogoAtlas.addEventListener('load', draw, { once: true });
  },
  watch() { AFTER.quick(); },
  editor() { if (app.editor.tab === 'teams') refreshEditorPreview(); else validateRosterForm(); },
  seasonEnd() { const s = career()?.seasonSummary; if (s && !s.seen) { s.seen = true; saveCareer(career()); setTimeout(() => audio.play(s.fired ? 'fired' : 'season'), 300); } },
};

function openEditor(teamId) {
  const id = teamId || app.editor.teamId || career()?.teamId || BASE_TEAMS[0].id;
  app.editor.teamId = id;
  const t = getTeam(id);
  app.editor.draft = { ...t, helmet: t.helmet || t.primary };
}
function readTeamForm() {
  const f = $('#team-form');
  if (!f) return;
  const d = app.editor.draft;
  for (const k of ['name', 'short', 'city', 'mascot']) d[k] = f.elements[k].value;
  d.primary = f.elements.primary.value;
  d.secondary = f.elements.secondary.value;
  d.helmet = f.elements.helmet.value;
  d.power = Number(f.elements.power.value);
}
function teamDraftProblems(d) {
  const problems = [];
  const short = fontKey(d.short).replace(/[^A-Z0-9]/g, '');
  if (!d.name.trim()) problems.push('Informe um nome.');
  if (!VALID_SHORT.test(short)) problems.push('A sigla precisa de 2 a 4 letras ou números.');
  else if (allTeams().some((t) => t.id !== app.editor.teamId && t.short === short)) problems.push(`A sigla ${short} já é usada por outro time.`);
  if (d.primary.toLowerCase() === d.secondary.toLowerCase()) problems.push('Escolha cores primária e secundária diferentes.');
  return problems;
}
function refreshEditorPreview() {
  const d = app.editor.draft;
  const preview = { ...d, short: fontKey(d.short).replace(/[^A-Z0-9]/g, '').slice(0, 4) || '???' };
  const u = $('#ed-uniform'), r = $('#ed-uniform-run'), z = $('#ed-endzone');
  if (u) drawUniformPreview(u, preview, 12, 0);
  if (r) drawUniformPreview(r, preview, 88, 4);
  if (z) drawEndZonePreview(z, preview);
  const cr = $('#ed-crest');
  if (cr) cr.innerHTML = crest(preview, 'xl');

function startBroadcastBreak(kind, quarter, halftime = false) {

  m.broadcastVariants[kind] = variant;
  const leaders = Object.fromEntries(Object.entries(st.leaders).map(([side, entries]) => [side,
    Object.values(entries).sort((a, b) => b.touchdowns - a.touchdowns || b.yards - a.yards)[0]]));
  m.broadcastBreak = { kind, endedQuarter: quarter, halftime, variant, elapsed: 0, leaders };
  app.keys.clear(); app.passKeys.clear(); app.charge = null; app.aim = null; app.drag = null;
  app.steerId = null; app.steerHold = 0; app.dragSteer = 0;

function onMatchEvent(ev) {
  const st = app.match?.engine.getState();
  if (!st) return;
  switch (ev.type) {
    case 'sound':
      audio.play(ev.title);
      if (ev.title === 'tackle') renderer.shake(2, 0.16);
      if (ev.title === 'catch') audio.swell(0.18, 0.4);
      break;
    case 'score': {
      const art = !st.simulating && scoreCutaway(st, ev);
      const scorer = ev.player || st.players.find((p) => p.team === ev.team && (ev.points === 3 ? p.role === 'K' : p.id === st.carrierId));
      const lead = ev.team === 'home' ? st.homeScore - st.awayScore : st.awayScore - st.homeScore;
      if (ev.returned) startPlayCutIn('returnTD', scorer, st);
      else if (ev.conversion) startPlayCutIn('twoPoint', scorer, st);
      else if (art?.kind === 'clutchWin' || art?.kind === 'clutchLoss') startPlayCutIn('clutchTD', scorer, st);
      else if (ev.points === 3 && lateMatch(st) && lead > 0 && lead <= 3) startPlayCutIn('clutchFG', scorer, st);
      else if (ev.points === 3 && ev.distance >= 50) startPlayCutIn('longFG', scorer, st);
      if (art) {
        const m = app.match;
        const previous = m.lastReaction[art.kind];
        const variant = previous === undefined ? Math.floor(Math.random() * SCORE_VARIANTS)
          : (previous + 1 + Math.floor(Math.random() * (SCORE_VARIANTS - 1))) % SCORE_VARIANTS;
        const image = scoreArt(art.kind, variant, art.team);
        if (image) {
          m.lastReaction[art.kind] = variant;
          m.reaction = { ...art, image, variant, elapsed: 0 };
          app.keys.clear(); app.drag = null; app.aim = null; app.charge = null; app.steerHold = 0; app.dragSteer = 0;
        }
      }
      if (st.mode === 'watch' || ev.team === 'home') {
        const team = ev.team === 'home' ? st.home : st.away;
        if (!app.match.reaction) renderer.banner(ev.title, ev.message, 'score', team.primary);
        audio.play('score'); audio.swell(0.95, 2.2); renderer.hype(3.4);
        if (ev.points >= 6) renderer.confetti([team.primary, team.secondary, '#e4bd62', '#fff1cb'], true);
      } else { if (!app.match.reaction) renderer.banner(ev.title, ev.message, 'bad'); audio.play('turnover'); audio.play('groan'); }
      break;
    }
    case 'firstDown':
      if (ev.fourth && (lateMatch(st) || Math.abs(st.homeScore - st.awayScore) <= 8)) startPlayCutIn('clutchFourth', ev.player, st);
      else if (ev.caught && ev.yards >= 40) startPlayCutIn('longPass', ev.player, st);
      else if (!ev.caught && ev.yards >= 25) startPlayCutIn('longRun', ev.player, st);
      renderer.banner('FIRST DOWN!', ev.message, 'good'); audio.play('firstDown'); audio.swell(0.35, 0.8);
      if (ev.yards >= 20) renderer.hype(1.5);
      break;
    case 'turnover':
      if (ev.title === 'INTERCEPTADO!') startPlayCutIn('interception', ev.player || st.players.find((p) => p.id === st.carrierId && p.team === 'away'), st);
      renderer.banner(ev.title, ev.message, 'bad'); audio.play('turnover'); audio.play('groan'); renderer.shake(3, 0.3);
      break;
    case 'period':
      if (ev.endedQuarter && !st.simulating) startBroadcastBreak('hosts', ev.endedQuarter, ev.halftime);
      else if (app.match.intro === null || ev.title !== 'KICKOFF') { renderer.banner(ev.title, ev.message, 'info'); audio.play('whistle'); }
      break;
    case 'defenseStop':
      if (['interception', 'sack', 'fumble', 'runStop'].includes(ev.bonus)) startPlayCutIn(ev.bonus, ev.player, st);
      renderer.banner(ev.title, ev.message, 'good'); audio.play('firstDown'); audio.swell(0.6, 1.4); if (ev.bonus) renderer.hype(2);
      break;
    case 'defenseCall': audio.play('alert'); break;
    case 'playEnd': audio.play('playEnd'); break;
    case 'bigPlay': renderer.banner(ev.title, '', 'good'); audio.swell(0.5, 1); break;
    case 'kickReturnBig': startPlayCutIn('longReturn', ev.player, st); break;
    case 'oneHandCatch': startPlayCutIn('oneHand', ev.player, st); break;
    case 'qteStart':
      app.keys.clear();
      app.drag = null; app.aim = null; app.charge = null;
      app.steerId = null; app.steerHold = 0; app.dragSteer = 0;
      audio.play('qte');
      break;
    case 'qteHit': renderer.shake(1.4, 0.12); break;
    case 'qteEnd':
      audio.play(ev.success ? 'qteGood' : ev.partial ? 'tackle' : 'qteBad');
      if (ev.success) { renderer.flash(); audio.swell(0.6, 1.2); }
      break;
    case 'final': {
      const watch = st.mode === 'watch';
      const winner = ev.result.won ? st.home : st.away;
      const celebrate = watch || ev.result.won;
      app.match.endTimer = 3;
      audio.play('final');
      audio.swell(celebrate ? 1 : 0.3, 2.5);
      renderer.banner(ev.title, ev.message, celebrate ? 'score' : 'bad', watch ? winner.primary : st.home.primary);
      if (celebrate) { renderer.confetti([winner.primary, winner.secondary, '#e4bd62', '#fff1cb']); renderer.hype(4); }
      break;
    }
    default: break;
  }
}
function finishMatch({ forfeit = false } = {}) {

/* Passe estilo Madden: toque rápido = passe alto (lob); segurar = passe forte (dispara sozinho na carga máxima). */
const LOB_MAX_HOLD = 0.2, BULLET_FULL_HOLD = 0.45;
function fireCharge() {
  const ch = app.charge;
  app.charge = null;
  if (!ch || !app.match) return;
  const eng = app.match.engine, id = ch.id === 'open' ? eng.mostOpenId() : ch.id;
  if (id) eng.throwTo(id, { power: ch.t < LOB_MAX_HOLD ? 'lob' : 'bullet' });

function updateCharge(dt) {
  if (!app.charge) return;
  if (!qbCanThrow(app.match.engine.getState())) { app.charge = null; return; }
  app.charge.t += dt;
  if (app.charge.t >= BULLET_FULL_HOLD) fireCharge();
}

function confirmDialog(title, text, okLabel = 'CONFIRMAR', danger = true) {

    const o = $('#overlay');
    const wasOpen = !o.classList.contains('hidden');
    const prev = o.innerHTML;
    o.innerHTML = `<div class="box pause-box" role="dialog" aria-modal="true"><div class="eyebrow">CONFIRMAR</div><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn ${danger ? 'danger' : 'primary'}" data-confirm="1">${esc(okLabel)}</button><button class="btn ghost" data-confirm="0" data-autofocus>CANCELAR</button></div></div>`;
    localizeMenu(o);
    o.classList.remove('hidden');
    o.querySelector('[data-autofocus]')?.focus();
    const handler = (e) => {
      const b = e.target.closest('[data-confirm]');
      if (!b) return;
      e.stopPropagation();
      o.removeEventListener('click', handler, true);
      const ok = b.dataset.confirm === '1';
      if (wasOpen && !ok) o.innerHTML = prev; else { o.classList.add('hidden'); o.innerHTML = ''; }
      resolve(ok);
    };
    o.addEventListener('click', handler, true);
  });
}

      setup[side] = t.value;

      toast(`${getTeam(app.editor.teamId).name} salvo.`);

  const canvas = renderer.canvas;

      else if (key === 'arrowleft' || key === 'a') { sel.index = (sel.index - 1 + n) % n; audio.play('move'); }
      else if (key === 'arrowright' || key === 'd') { sel.index = (sel.index + 1) % n; audio.play('move'); }
      else if (key === 'arrowup' || key === 'w') { sel.index = Math.max(0, sel.index - sel.cols); audio.play('move'); }
      else if (key === 'arrowdown' || key === 's') { sel.index = Math.min(n - 1, sel.index + sel.cols); audio.play('move'); }
      else if (key === 'enter' || key === ' ') pickScene(st, sel.index);
      else if (key === 't') { if (eng.callTimeout()) renderer.banner('TEMPO PEDIDO', '', 'info'); }
      else if (key === 'p' || key === 'escape') pauseMatch();
      return;
    }
    // Q W E R T: um recebedor cada; Y: o mais livre. Só valem com o QB lendo a defesa; fora disso, as teclas mantêm a função normal.
    const target = PASS_TARGETS.find((x) => x.key === key);
    if ((target || key === PASS_OPEN_KEY) && qbCanThrow(st) && !st.scrambling) {
      app.keys.delete(key);
      app.passKeys.add(key);
      if (!app.charge) app.charge = { id: target ? target.id : 'open', key, t: 0 };
      return;
    }
    if (key === ' ' || key === 'enter') primaryAction();
    else if (key === SCRAMBLE_KEY) eng.run();
    else if (key === 'e') eng.dive();
    else if (key === 'q') eng.changePlay();
    else if (key === 't') { if (eng.callTimeout()) renderer.banner('TEMPO PEDIDO', `${eng.getState().timeouts} restantes`, 'info'); }
    else if (key === 'p' || key === 'escape') pauseMatch();
    else if (key === 'f') ACTIONS.fullscreen();
  });
  document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    app.keys.delete(key);
    app.passKeys.delete(key);
    if (app.charge && app.charge.key === key && app.screen === 'match' && !app.paused) fireCharge();
  });
  const autoPause = () => { app.keys.clear(); app.passKeys.clear(); app.drag = null; app.aim = null; app.charge = null; app.steerHold = 0; if (app.screen === 'match' && app.match && !app.paused) pauseMatch(); };
  window.addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { autoPause(); if (career()) saveCareer(career()); } });
  window.addEventListener('resize', () => { renderer.resize(); updateRotateHint(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => renderer.resize(), 60));
}

   DEMO (fundo animado dos menus) e LOOP
   ===================================================================== */
function startDemo() {
  const c = career();
  const home = c ? getTeam(c.teamId) : getTeam(app.settings.quickHome);
  let away = c ? nextOpponent(c) : getTeam(app.settings.quickAway);
  if (!away || away.id === home.id) away = getTeam(BASE_TEAMS.find((t) => t.id !== home.id).id);
  demo.engine.start({ home, away, quarterSeconds: 180, difficulty: 'normal', seed: Date.now() });
  demo.phase = '';
}
function updateDemo(dt) {
  const e = demo.engine;
  let st = e.getState();
  if (st.phase === 'final' || st.phase === 'idle') { startDemo(); st = e.getState(); }
  if (st.phase !== demo.phase) { demo.phase = st.phase; demo.t = 0; }
  demo.t += dt;
  e.setInput({});
  if (st.qte && !st.qte.result) {
    const q = st.qte, k = q.t / q.duration;
    if (q.type === 'sequence' && q.t > (q.step + 1) * 0.22) e.qteInput(q.sequence[q.step]);
    else if (q.type === 'timing' && k > (q.window[0] + q.window[1]) / 2) e.qteInput('tap');
  } else if (st.phase === 'playcall' && demo.t > 0.5) e.callPlay(pick(st.playbook, Math.random).id);
  else if (st.phase === 'presnap' && demo.t > 1.1) e.snap();
  else if (st.phase === 'live') {
    const c = st.players.find((p) => p.id === st.carrierId);
    if (c?.role === 'QB' && !st.scrambling && !RUSH_PLAYS.has(st.playId) && demo.t > 1.4) e.throwBall();
    demo.steerT -= dt;
    if (demo.steerT <= 0) { demo.steer = Math.random() < 0.5 ? 0 : Math.random() < 0.5 ? -1 : 1; demo.steerT = 0.3 + Math.random() * 0.5; }
    e.setInput({ x: 0.5, y: demo.steer });
  } else if (st.phase === 'choice') e.choose(st.choiceKind === 'conversion' ? 'pat' : st.choices.some((c) => c.id === 'fieldgoal') ? 'fieldgoal' : 'punt');
  else if (st.phase === 'kick' && Math.abs(st.kickMeter - st.kickCenter) <= st.kickTolerance / 2) e.kick();
  else if (st.phase === 'kickoff' && st.kickoff.kicking === 'home' && st.kickMeter >= st.kickoff.center) e.kick();
  else if (st.phase === 'kickreturn') e.chooseKickoffReturn('fair');
  else if (st.phase === 'dead' && demo.t > 1.4) e.next();
  else if (st.phase === 'defcall' && demo.t > 0.4) e.callDefense(pick(DEFENSE_CALLS, Math.random).id);
  let left = dt;
  while (left > 1e-5) { const step = Math.min(left, 1 / 60); e.update(step); left -= step; }
}
let lastFrame = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - (lastFrame || now)) / 1000);
  lastFrame = now;
  try {
    if (app.screen === 'match' && app.match) {
      const m = app.match, eng = m.engine;
      if (!app.paused && m.intro !== null) {
        if (m.intro < MATCH_INTRO_REVEAL && m.intro + dt >= MATCH_INTRO_REVEAL) audio.play('broadcastReveal');
        m.intro += dt;
        if (m.intro >= MATCH_INTRO_SECONDS) m.intro = null;
      } else if (!app.paused && m.playCutIn) {
        m.playCutIn.elapsed += dt;
        if (m.playCutIn.elapsed >= PLAY_CUT_INS[m.playCutIn.kind].seconds) m.playCutIn = null;
      } else if (!app.paused && m.reaction) {
        m.reaction.elapsed += dt;
        if (m.reaction.elapsed >= SCORE_REACTION_SECONDS) m.reaction = null;
      } else if (!app.paused && m.broadcastBreak) {
        m.broadcastBreak.elapsed += dt;
        if (m.broadcastBreak.elapsed >= BROADCAST_BREAK_SECONDS[m.broadcastBreak.kind]) nextBroadcastBreak();
      } else if (!app.paused) {
        const k = app.keys;
        const kx = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0);
        const ky = (k.has('s') || k.has('arrowdown') ? 1 : 0) - (k.has('w') || k.has('arrowup') ? 1 : 0);
        eng.setInput({ x: kx, y: app.steerHold || app.dragSteer || ky, sprint: k.has('shift') });
        let left = dt * (m.mode === 'watch' ? m.speed : 1);
        while (left > 1e-5 && !m.reaction && !m.playCutIn && !m.broadcastBreak) { const step = Math.min(left, 1 / 60); eng.update(step); left -= step; }
        updateCharge(dt);
        if (m.endTimer > 0) { m.endTimer -= dt; if (m.endTimer <= 0) finishMatch(); }
      }
      const charge = app.charge ? { id: app.charge.id === 'open' ? eng.mostOpenId() : app.charge.id, k: clamp(app.charge.t / BULLET_FULL_HOLD, 0, 1) } : null;
      if (app.match) renderer.draw(eng.getState(), app.paused ? 0 : dt, { mode: 'match', aim: app.aim, touch: app.touch, charge, intro: m.intro, playCutIn: m.playCutIn, reaction: m.reaction, broadcastBreak: m.broadcastBreak, speed: m.speed });
    } else {
      updateDemo(dt);
      renderer.draw(demo.engine.getState(), dt, { mode: 'attract' });
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

    wrongCombo.qteInput(wrongState.qte.sequence[1]);
    ok(wrongState.qte.result === 'fail' && wrongState.qte.step === 0, 'QTE falha ao apertar uma tecla fora de ordem');
    const expiredCombo = sequenceQte(5), expiredState = expiredCombo.getState();
    const timeLimit = expiredState.qte.duration;
    for (let i = 0; i < Math.ceil(timeLimit / 0.05) + 1 && !expiredState.qte.result; i++) expiredCombo.update(0.05);
    ok(expiredState.qte.result === 'fail' && expiredState.qte.t >= timeLimit, 'QTE de sequência expira ao fim do tempo');
    const extra = (meter) => {
      const e = createMatchEngine();
      e.start(matchOpts); e.callPlay('pass'); e.snap();
      const s = e.getState();
      s.players.find((p) => p.id === 'qb').x = 110.9;
      e.update(1 / 60); e.next(); e.choose('pat');
      s.kickMeter = meter;
      e.kick();
      let crossed = false;
      for (let i = 0; i < 180 && s.phase === 'flight'; i++) {
        e.update(1 / 60);
        const ball = s.ball;
        crossed ||= ball.x >= GOALPOST.x && ball.height > GOALPOST.bar && ball.y > GOALPOST.near && ball.y < GOALPOST.far;
      }
      e.next();
      return { score: s.homeScore, crossed, clock: s.clock, kickoff: s.phase === 'kickoff' && s.kickoff.receiver === 'away' };
    };
    const converted = extra(KICK_TARGET), missed = extra(0.2);
    ok(converted.crossed && converted.score === 7 && converted.clock === missed.clock, 'extra point cruza as traves, marca +1 e preserva o relógio');
    ok(!missed.crossed && missed.score === 6, 'erro fora da janela mantém os seis pontos');
    ok(converted.kickoff && missed.kickoff, 'conversão acertada ou errada leva ao kickoff');
    const advanceUntil = (e, predicate, ticks = 600) => {
      const s = e.getState();
      for (let i = 0; i < ticks && !predicate(s); i++) e.update(1 / 60);
      return s;
    };
    const reception = (covered, seed = 7, power = 'lob') => {
      const e = createMatchEngine(); e.start({ ...matchOpts, qte: true, seed });
      e.callPlay('pass'); e.snap(); e.update(0.05); e.throwTo('te', { power });
      const s = e.getState();
      for (const p of s.players.filter((p) => p.team === 'away')) { p.y = 49; p.speed = 0; }
      if (covered) {
        const defender = s.players.find((p) => p.team === 'away' && p.role === 'DB');
        defender.x = s.passTarget.x; defender.y = s.passTarget.y;
      }
      advanceUntil(e, (s) => s.qte?.kind === 'catch');
      return e;
    };
    const contested = reception(true).getState().qte?.window, open = reception(false).getState().qte?.window;
    ok(contested && open && open[1] - open[0] > (contested[1] - contested[0]) * 1.6,
      'a janela de recepção abre quando o recebedor está livre e estreita sob cobertura');
    const midpoint = (w) => (w[0] + w[1]) / 2;
    const varied = reception(false, 8).getState().qte?.window;
    ok(contested && open && varied && midpoint(open) > midpoint(contested) + 0.12 &&
      Math.abs(midpoint(open) - midpoint(varied)) > 0.001, 'posição da faixa de recepção varia com cobertura e entre passes');
    const catchResult = (hit, power = 'lob') => {
      const e = reception(false, 7, power), s = e.getState(), qte = s.qte;
      if (!qte) return { carrier: '', completions: s.stats.completions, dropped: false };
      const timing = hit === 'gold' && qte.perfectWindow ? midpoint(qte.perfectWindow)
        : hit === 'miss' ? 0 : qte.window[0] + (qte.window[1] - qte.window[0]) * 0.12;
      qte.t = timing * qte.duration;
      e.qteInput('tap');
      advanceUntil(e, (s) => s.phase !== 'flight');
      return { carrier: s.players.find((p) => p.id === s.carrierId)?.anim, completions: s.stats.completions,
        dropped: s.players.some((p) => p.anim === 'catchMiss') };
    };
    const highCatch = catchResult('green'), lowCatch = catchResult('green', 'bullet');
    const oneHandCatch = catchResult('gold'), missedCatch = catchResult('miss');
    ok(highCatch.carrier === 'catchHigh' && lowCatch.carrier === 'catchLow' && highCatch.completions === 1 && lowCatch.completions === 1,
      'o timing no verde usa poses próprias para passes altos e baixos');
    ok(oneHandCatch.carrier === 'catchOne' && oneHandCatch.completions === 1,
      'o timing no segmento dourado garante a animação de recepção com uma mão');
    ok(missedCatch.dropped && missedCatch.completions === 0, 'o recebedor reage à tentativa de recepção perdida');
    const weatherPass = (weather, x, y, seed = matchOpts.seed) => {
      const e = createMatchEngine(); e.start({ ...matchOpts, seed, weather });
      e.callPlay('pass'); e.snap(); e.throwBall({ x, y });
      return e.getState().passTarget;
    };
    ok(weatherPass('clear', 118, 27).x - weatherPass('snow', 118, 27).x > 5, 'neve diminui o alcance dos passes longos');
    ok([7, 8, 9].some((seed) => dist(weatherPass('rain', 53, 22, seed), weatherPass('clear', 53, 22, seed)) > 0.2),
      'chuva afeta a mira de um passe colocado');
    ok(weatherPass('wind', 69, 25).y !== weatherPass('clear', 69, 25).y &&
      dist(weatherPass('fog', 53, 22), weatherPass('clear', 53, 22)) === 0,
      'vento desvia o passe colocado e a névoa preserva sua trajetória');
    const beginTwoPoint = () => {
      const e = createMatchEngine(), s = e.start({ ...matchOpts, qte: true });
      s.phase = 'choice'; s.choiceKind = 'conversion';
      e.choose('two');
      return { e, s };
    };
    const timingWidth = (engine) => {
      engine._debug.qte('timing');
      const [a, b] = engine.getState().qte.window;
      return b - a;
    };
    const regularTiming = createMatchEngine();
    regularTiming.start({ ...matchOpts, qte: true });
    ok(timingWidth(beginTwoPoint().e) < timingWidth(regularTiming) * 0.5, 'dois pontos têm uma janela verde menor que metade da janela normal');
    const twoPointResult = (correct) => {
      const { e, s } = beginTwoPoint();
      e.callPlay('slants'); e.snap(); e.run();
      s.players.find((p) => p.id === 'qb').x = 110.1;
      e.update(1 / 60);
      const q = s.qte;
      if (q?.kind !== 'conversion') return null;
      const scoreBeforeInput = s.homeScore;
      if (correct) q.sequence.forEach(e.qteInput);
      else e.qteInput(Object.keys(QTE_KEYS).find((key) => key !== q.sequence[0]));
      advanceUntil(e, (state) => state.phase === 'dead');
      return { count: q.sequence.length, scoreBeforeInput, score: s.homeScore };
    };
    const twoMade = twoPointResult(true), twoMissed = twoPointResult(false);
    ok(twoMade?.count >= 8 && twoMade.count <= 10 && twoMade.scoreBeforeInput === 0 && twoMade.score === 2 && twoMissed?.score === 0,
      'conversão de dois pontos só pontua com a sequência completa de 8 a 10 comandos');
    const braking = (weather) => {
      const e = createMatchEngine(); e.start({ ...matchOpts, weather });
      e.callPlay('pass'); e.snap(); e.run();
      const qb = e.getState().players.find((p) => p.id === 'qb');
      qb.vy = 4; e.setInput({ y: -1 }); e.update(0.05);
      return qb.vy;
    };
    ok(braking('snow') > braking('rain') && braking('rain') > braking('clear'), 'gelo e chuva retardam a mudança de direção');
    const fieldGoal = (los, aim) => {
      const e = createMatchEngine(); e.start(matchOpts);
      const s = e.getState();
      s.los = los; e.choose('fieldgoal');
      const tolerance = s.kickTolerance;
      s.kickMeter = aim(s.kickCenter, tolerance); e.kick();
      let before = s.ball.x, crossed = false, rebounded = false;
      for (let i = 0; i < 240 && s.phase === 'flight'; i++) {
        e.update(1 / 60);
        crossed ||= s.ball.x >= GOALPOST.x && s.ball.height > GOALPOST.bar && s.ball.y > GOALPOST.near && s.ball.y < GOALPOST.far;
        rebounded ||= s.ball.x < before; before = s.ball.x;
      }
      return { crossed, rebounded, tolerance, score: s.homeScore, title: s.title };
    };
    const fromNear = fieldGoal(100, (center) => center), fromFar = fieldGoal(65, (center) => center);
    ok(fromFar.tolerance < fromNear.tolerance && fromNear.crossed && fromFar.crossed && fromFar.score === 3, 'field goal longo exige mais precisão e cruza as traves ao acertar');
    const shortKick = fieldGoal(65, () => 0.2), uprightKick = fieldGoal(80, (center, width) => center - width - 0.01);
    ok(shortKick.score === 0 && shortKick.title === 'CHUTE CURTO' && uprightKick.score === 0 && uprightKick.rebounded && uprightKick.title === 'NA TRAVE!', 'field goal curto cai antes da trave e o chute na trave rebate');
    const downEngine = createMatchEngine();
    downEngine.start(matchOpts);
    const downState = downEngine.getState();
    const incomplete = () => {
      downEngine.callPlay('pass'); downEngine.snap();
      const qb = downState.players.find((p) => p.id === 'qb');
      // Isola o lado do campo onde o passe cairá.
      for (const p of downState.players) if (p !== qb) p.y = 49;
      downEngine.throwBall({ x: qb.x + 1.2, y: 0.8 });
      advanceUntil(downEngine, (s) => s.phase === 'dead');
      downEngine.next();
    };
    const downs = [];
    for (let i = 0; i < 3; i++) { incomplete(); downs.push(downState.down); }
    ok(downs.join() === '2,3,4' && downState.phase === 'choice' && downState.choiceKind === 'fourth', 'três passes incompletos levam à quarta descida');
    downEngine.choose('go'); incomplete();
    ok(downState.possession === 'away', 'quarta descida sem avanço entrega a posse no ponto da jogada');
    const advance = dropback('pass', 0);
    const advanceState = advance.getState(), line = advanceState.firstDownX;
    const qbAdvance = advanceState.players.find((p) => p.id === 'qb');
    advanceState.down = 3; advance.run(); qbAdvance.x = line + 1; qbAdvance.y = FIELD_W + 0.5;
    advance.update(1 / 60);
    ok(advanceState.down === 1 && advanceState.firstDownX > line && advanceState.stats.firstDowns === 1, 'avanço suficiente reinicia a contagem na primeira descida');
    const kickoffAt = (receiver, meter) => {
      const e = createMatchEngine(); e.start({ ...matchOpts, qte: true }); e._debug.kickoff(receiver);
      const s = e.getState(), initialClock = s.clock;
      if (receiver === 'away') { s.kickMeter = meter(s.kickoff.center); e.kick(); }
      advanceUntil(e, (state) => !['flight', 'kickoff'].includes(state.phase));
      return { e, s, initialClock };
    };
    const touchback = kickoffAt('away', (center) => center);
    ok(touchback.s.title === 'TOUCHBACK' && touchback.s.kickoff.spot === 85 && touchback.s.clock === touchback.initialClock, 'touchback dá a posse na linha de 25 sem descontar tempo');
    const outOfBounds = kickoffAt('away', () => 0);
    ok(outOfBounds.s.title === 'KICKOFF PARA FORA' && outOfBounds.s.kickoff.spot <= 75, 'kickoff para fora entrega a bola na linha de 35 ou em posição melhor');
    const returning = kickoffAt('home');
    ok(returning.e.chooseKickoffReturn('return') && returning.s.qte.sequence.length >= 3 && returning.s.qte.sequence.length <= 5, 'retorno manual abre uma sequência aleatória de comandos');
    returning.s.qte?.sequence.forEach(returning.e.qteInput);
    advanceUntil(returning.e, (s) => s.phase === 'dead');
    const returnSpot = returning.s.kickoff.spot;
    returning.e.next();
    ok(returning.s.stats.kickoffReturns === 1 && returning.s.clock < returning.initialClock &&
      (returnSpot === undefined ? returning.s.choiceKind === 'conversion' : returning.s.los === returnSpot && returning.s.down === 1),
    'retorno usa o relógio e define a nova posse ou o touchdown');
    const defenseCombo = (seed, call, difficulty) => {
      const e = createMatchEngine(); e.start({ ...matchOpts, qte: true, seed, difficulty }); e._debug.defense(); e.callDefense(call);
      return { e, s: advanceUntil(e, (s) => !!s.qte) };
    };
    const looks = new Set();
    let validLook = true;
    for (let seed = 1; seed <= 24; seed++) {
      const e = createMatchEngine(), s = e.start({ ...matchOpts, seed });
      const defenders = s.players.filter((p) => p.team === 'away');
      looks.add(s.defensiveLook);
      validLook &&= defenders.length === 11 && new Set(defenders.map((p) => p.id)).size === 11;
      const initial = s.defensiveLook;
      e.callPlay('sweep');
      validLook &&= s.defensiveLook === initial;
    }
    ok(validLook && looks.size >= 4, 'a IA varia o alinhamento de onze defensores antes da escolha do ataque');
    const chosenLooks = DEFENSE_CALLS.map(({ id }) => defenseCombo(2, id, 'normal').s);
    ok(new Set(chosenLooks.map((s) => s.defensiveLook)).size === DEFENSE_CALLS.length &&
      chosenLooks.every((s) => s.players.filter((p) => p.team === 'home').length === 11),
      'as seis chamadas defensivas têm formações próprias com onze jogadores');
    ok(chosenLooks.find((s) => s.defense.call === 'goal').qte.prompt === 'PARE A CORRIDA!',
      'linha do gol apresenta o desafio de defesa contra a corrida');
    const defensiveLengths = Array.from({ length: 16 }, (_, seed) => defenseCombo(seed, seed % 2 ? 'man' : 'zone', seed % 2 ? 'hard' : 'easy').s.qte.sequence.length);
    ok(Math.min(...defensiveLengths) === 7 && Math.max(...defensiveLengths) === 10 && new Set(defensiveLengths).size > 2,
      'defesa de passe sorteia sequências mais longas, entre 7 e 10 comandos');
    const ten = Array.from({ length: 16 }, (_, seed) => defenseCombo(seed, 'man', 'hard')).findIndex(({ s }) => s.qte.sequence.length === 10);
    const defend = (action) => {
      const { e, s } = defenseCombo(ten, 'man', 'hard');
      const misses = action === 'success' ? 0 : action === 'partial' ? 2 : 3;
      s.qte.sequence.forEach((key, i) => e.qteInput(i < misses ? Object.keys(QTE_KEYS).find((other) => other !== key) : key));
      return s;
    };
    const intercepted = defend('success'), tackled = defend('partial'), escaped = defend('fail');
    ok(intercepted.qte.result === 'success' && intercepted.stats.defensiveInterceptions === 1 && intercepted.possession === 'home', 'sequência completa na defesa intercepta o passe');
    ok(tackled.qte.result === 'partial' && tackled.qte.correct === 8 && tackled.qte.sequence.length === 10 &&
      tackled.players.some((p) => p.id === tackled.carrierId && p.anim === 'down'), '80% de acerto derruba o recebedor com a bola');
    ok(escaped.qte.result === 'fail' && escaped.qte.correct === 7 && escaped.defense.scene.escaped, 'abaixo de 80% o recebedor escapa');
    const cup = createChampionship('national', 'texas', 520);
    for (let i = 0; i < 12 && !cup.championId; i++) advanceChampionship(cup);
    ok(cup.seeds.length === 12 && cup.bracket.length === 4 && cup.championId && cup.bracket[0].filter((game) => !game.awayId).length === 4, 'campeonato nacional com 12 classificados, quatro folgas e campeão');
    ok(seasons === 3, `${seasons} temporadas simuladas, ${fired} demissões`);
  } catch (err) { out.push(`FAIL exceção: ${err.message}\n${err.stack}`); }
  document.body.innerHTML = `<pre id="selftest">${esc(out.join('\n'))}</pre>`;
  document.title = out.some((l) => l.startsWith('FAIL')) ? 'SELFTEST FAIL' : 'SELFTEST PASS';
}
