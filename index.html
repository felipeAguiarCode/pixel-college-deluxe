:root{--paper:#f5f2e8;--white:#fffdf5;--ink:#07121b;--navy:#142d3d;--night:#0b1824;--panel:#11283a;--panel-2:#183650;--panel-3:#0d1f2d;--line:#24506b;--cream:#fff1cb;--muted:#8fa3a0;--orange:#f16a43;--orange-dark:#c44a2d;--teal:#307a72;--gold:#e4bd62;--gold-dark:#b48a35;--green:#6cc070;--red:#e2574c;--display:PixelDisplay,monospace;--body:PixelText,monospace}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--body);font-size:22px;line-height:1.15;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
p{margin:.5em 0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.35;letter-spacing:0}
h2{font-size:16px}h3{font-size:12px}
#game{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
.ui{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;z-index:2;background:radial-gradient(ellipse at 50% 26%,#17313d,#091721 72%);-webkit-overflow-scrolling:touch}
.ui[data-screen=title]{background:radial-gradient(ellipse at 66% 27%,#14303e,#081521 64%)}
.ui.hidden,.hidden{display:none!important}
.ui,.table-scroll,.bracket{scrollbar-color:#436371 #102531;scrollbar-width:thin}
body.in-match #game{cursor:crosshair}
.screen{min-height:100%;width:100%;max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--display);font-size:8px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;line-height:1.6}
.muted{color:var(--muted)}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--gold)}
small{font-size:.8em}

/* Caixas e botões em pixel */
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 4px 4px 0 var(--line),inset -4px -4px 0 #0a1a26,0 6px 0 rgba(0,0,0,.4);padding:18px}
.btn{font-family:var(--display);font-size:10px;line-height:1.5;text-transform:uppercase;color:#13222e;background:var(--cream);border:4px solid var(--ink);padding:10px 14px;cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.38);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;text-align:center}
.btn small{font-family:var(--body);font-size:18px;text-transform:none;opacity:.85}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){box-shadow:inset 4px 4px 0 rgba(0,0,0,.25)}
.btn:focus-visible,.tile:focus-visible,.team-chip:focus-visible,.swatch:focus-visible,.mini:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--orange);color:var(--white)}
.btn.teal{background:var(--teal);color:var(--white)}
.btn.gold{background:var(--gold);color:#13222e}
.btn.ghost{background:var(--panel-2);color:var(--cream);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.07)}
.btn.danger{background:var(--red);color:var(--white)}
.btn.small{font-size:8px;min-height:34px;padding:6px 10px;border-width:3px}
.btn.big{font-size:14px;min-height:60px;padding:14px 22px}
.btn.wide{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.actions.col{flex-direction:column;align-items:stretch}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:8px;background:var(--panel-3);border:3px solid var(--ink);padding:6px 8px}
.pill{font-family:var(--display);font-size:7px;background:var(--gold);color:#13222e;padding:2px 4px;margin-right:4px}
.tag{font-family:var(--display);font-size:6px;font-style:normal;background:var(--teal);color:#fff;padding:2px 4px}

/* Cabeçalho de tela */
.screen-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding-bottom:12px;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--line)}
.screen-head h2{font-size:clamp(12px,2.4vw,20px);text-shadow:4px 4px 0 var(--ink)}
.head-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Menu principal */
.title-screen{max-width:1320px;position:relative;isolation:isolate;justify-content:center;gap:16px}
.main-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 10px;border-bottom:2px solid #294553}
.main-nav nav{display:flex;gap:8px}
.title-backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#0b1c28}
.title-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#071721e8,#0b1b27c7 45%,#071520f5);pointer-events:none}
.title-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated;z-index:-2;opacity:0;transition:opacity .65s ease}
.title-art.is-active{opacity:1}
@media(prefers-reduced-motion:reduce){.title-art{transition:none}}
.title-mark{display:flex;align-items:center;gap:10px}
.title-mark img{width:clamp(34px,4.25vw,58px);image-rendering:pixelated}
.title-mark h1{display:grid;gap:5px;margin:0;color:#fff7df;text-shadow:2px 2px #07121b}
.title-mark h1 span{font-size:clamp(7px,1.02vw,13px)}
.title-mark h1 strong{color:#f5ba68;font-weight:400;font-size:clamp(15px,2.45vw,34px);line-height:1.1;text-shadow:2px 2px #b34d2c,4px 4px #07121b}
.title-modes{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:clamp(165px,32vh,280px) clamp(145px,24vh,220px);gap:9px}
.mode-tile{position:relative;isolation:isolate;display:flex;min-width:0;min-height:136px;align-items:flex-end;gap:10px;padding:12px 14px;overflow:hidden;border:1px solid #5c737a;border-bottom:4px solid var(--mode-accent);background:#172c3a;text-align:left;cursor:pointer}
.mode-tile[data-mode=career]{grid-column:1/6;grid-row:1/3}
.mode-tile[data-mode=quick]{grid-column:6/11;grid-row:1}
.mode-tile[data-mode=watch]{grid-column:11/-1;grid-row:1}
.mode-tile[data-mode=championship]{grid-column:6/9;grid-row:2}
.mode-tile[data-mode=challenge]{grid-column:9/12;grid-row:2}
.mode-tile[data-mode=editor]{grid-column:12/-1;grid-row:2}
.mode-tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#071722 0%,#071722e8 17%,#081b2855 61%,#08172200 83%);pointer-events:none}
.mode-tile:hover,.mode-tile:focus-visible{border-color:var(--mode-accent)}
.mode-tile:focus-visible{outline:2px solid var(--mode-accent);outline-offset:1px}
.mode-image{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 43%;image-rendering:pixelated;pointer-events:none}
.mode-tile[data-mode=career] .mode-image{object-position:61% center}
.mode-tile[data-mode=quick] .mode-image{object-position:center 46%}
.mode-tile[data-mode=watch] .mode-image{object-position:center 33%}
.mode-tile[data-mode=championship] .mode-image{object-position:center 13%}
.mode-tile[data-mode=challenge] .mode-image{object-position:center 41%}
.mode-tile strong{display:block;font:clamp(8px,1.12vw,14px)/1.55 var(--display);color:#faf1d6;text-shadow:2px 2px #07121b}
.mode-tile small{display:block;margin-top:4px;color:#c2d7d9;font-size:17px;line-height:1.15}
.mode-tile > b{margin-left:auto;font:11px/1 var(--display);color:var(--mode-accent);padding-bottom:4px}
.mode-badges{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:3px;padding:3px;background:#081722c0;border:1px solid #95a3a0}
.mode-badges .crest.sm{width:27px;height:27px}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Brasões, estrelas, barras */
.crest{position:relative;display:inline-grid;place-items:center;width:40px;height:45px;flex:none}
.crest svg{position:absolute;inset:0;width:100%;height:100%}
.crest b{position:relative;font-family:var(--display);font-weight:400;font-size:8px;margin-top:-6px}
.crest.long b{font-size:6px}
.crest.sm{width:22px;height:25px}.crest.sm b{font-size:0}
.crest.lg{width:64px;height:72px}.crest.lg b{font-size:12px}
.crest.xl{width:84px;height:94px}.crest.xl b{font-size:16px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars i{width:10px;height:10px;background:#2c4658;clip-path:polygon(40% 0,60% 0,60% 30%,100% 30%,100% 50%,80% 50%,80% 70%,100% 100%,60% 80%,40% 80%,0 100%,20% 70%,20% 50%,0 50%,0 30%,40% 30%)}
.stars i.on{background:var(--gold)}
.tier{font-size:16px;color:var(--gold);letter-spacing:1px}.tier span{color:#2c4658}
.bar{height:12px;background:var(--ink);border:2px solid var(--ink);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.25) 6px 8px)}
.bar.thin{height:8px}
.bar.done i,.bar.good i{background-color:var(--green)}
.bar.failed i,.bar.bad i{background-color:var(--red)}
.bar.warn i{background-color:var(--gold)}
.conf-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.conf-top b{font-family:var(--display);font-size:14px}
.conf.good .conf-top b{color:var(--green)}.conf.warn .conf-top b{color:var(--gold)}.conf.bad .conf-top b{color:var(--red)}
.portrait{width:30px;height:40px;flex:none;image-rendering:pixelated}

/* Layouts */
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.split.editor{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card-grid.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--panel-3);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 #1c3d52;padding:12px;display:flex;flex-direction:column;gap:8px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-family:var(--display);font-size:10px;color:var(--gold)}
.athlete{display:flex;align-items:center;gap:10px}
.athlete span{display:flex;flex-direction:column;gap:2px}
.athlete strong{font-weight:400;font-size:22px;color:var(--cream)}
.athlete small{color:var(--muted)}
.wallet{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.wallet b{font-family:var(--display);font-size:10px;color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field>span{font-family:var(--display);font-size:8px;color:var(--gold)}
input,select{background:var(--panel-3);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 rgba(0,0,0,.3);padding:8px 10px;font-size:22px;color:var(--cream);width:100%;min-height:44px;user-select:text}
input[type=range]{padding:0;accent-color:var(--orange)}
input[type=color]{width:44px;height:34px;padding:2px;min-height:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.table-scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:20px}
.table th{font-family:var(--display);font-weight:400;font-size:8px;color:var(--gold);text-align:left;padding:8px;border-bottom:4px solid var(--ink);white-space:nowrap}
.table td{padding:8px;border-bottom:2px solid #1d3a4f;vertical-align:middle}
.table tr.own td{background:rgba(228,189,98,.12)}
.table tr.benched td{opacity:.55}
.team-cell{display:inline-flex;align-items:center;gap:8px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.training{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.rules{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;justify-content:space-between;gap:12px}
.rules li b{font-family:var(--display);font-size:10px}
.rules.plain li{display:block}.rules.plain li b{margin-right:6px}

/* Hub */
.hub-bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.hub-id{flex:1 1 200px;min-width:0}
.hub-id h2{font-size:clamp(12px,2vw,18px)}
.hub-id p{margin:4px 0 0;color:var(--muted)}
.hub-stats{display:flex;gap:18px;flex-wrap:wrap}
.hub-stats div{display:flex;flex-direction:column}
.hub-stats b{font-family:var(--display);font-size:12px;color:var(--cream)}
.hub-stats small{font-family:var(--display);font-size:7px;color:var(--muted);margin-top:4px}
.hub-conf{flex:1 1 220px;min-width:200px}
.hub-main{display:grid;grid-template-columns:minmax(300px,0.9fr) minmax(0,1.35fr);gap:14px;align-items:stretch}
.hub-next{display:flex;flex-direction:column;gap:12px;justify-content:center}
.hub-next h3{font-size:14px;line-height:1.5}
.matchup{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:6px}
.vs{font-family:var(--display);font-size:20px;color:var(--gold);text-shadow:4px 4px 0 var(--ink)}
.matchup-names{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:12px;font-size:22px}
.matchup-power{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--display);font-size:8px;color:var(--muted)}
.goal-mini{display:flex;flex-direction:column;gap:6px}
.goal-line{display:grid;grid-template-columns:auto 1fr minmax(80px,30%);align-items:center;gap:4px 10px;font-size:19px}
.goal-line small{grid-column:2/-1;color:var(--muted)}
.goal-line.done .label{color:var(--green)}.goal-line.failed .label{color:var(--red);text-decoration:line-through}
.goal-line .mark{font-family:var(--display);font-size:14px;justify-self:end}
.goal-line.done .mark{color:var(--green)}.goal-line.failed .mark{color:var(--red)}
.hub-next .actions{justify-content:center}
.hub-news{text-align:center;color:#bcd2cc;font-size:20px;margin:0}
.event-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.event-choices .btn{flex-direction:column;gap:4px}

/* Metas */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal-card{display:flex;flex-direction:column;gap:8px}
.goal-card h3{font-size:12px;line-height:1.6}
.goal-card.done{box-shadow:inset 4px 4px 0 #2f6b3c,inset -4px -4px 0 #0a1a26,0 6px 0 rgba(0,0,0,.4)}
.goal-card.failed{box-shadow:inset 4px 4px 0 #6b2f36,inset -4px -4px 0 #0a1a26,0 6px 0 rgba(0,0,0,.4)}
.goal-top,.goal-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--display);font-size:7px;padding:4px 6px;background:var(--panel-2)}
.badge.done{background:var(--green);color:#0b1720}.badge.failed{background:var(--red);color:#fff}

/* Novos jogos e editor */
.conf-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.conf-tabs .btn{min-width:52px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.team-grid.compact{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.team-chip{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel-3);border:3px solid var(--ink);padding:10px 6px;cursor:pointer;color:var(--cream);font-size:18px;text-align:center}
.team-chip:hover{background:#163248}
.team-chip.active{border-color:var(--gold);background:#1d4060}
.detail h3{font-size:14px}
.preview-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
canvas.uniform{width:84px;height:108px;image-rendering:pixelated;image-rendering:crisp-edges;background:radial-gradient(circle at 50% 90%,#2f6b3c 0 30%,transparent 31%)}
canvas.uniform.big{width:112px;height:144px}
canvas.endzone{width:180px;height:120px;image-rendering:pixelated;border:3px solid var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{width:28px;height:28px;border:3px solid var(--ink);cursor:pointer;padding:0}
.swatch.active{outline:3px solid var(--gold);outline-offset:1px}
.edit-table input,.edit-table select{font-size:20px;min-height:38px;padding:4px 8px}
.edit-table input[type=number]{width:80px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}

/* Jogo rápido */
.quick-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.quick-side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.quick-side h3{font-size:12px}
.vs-big{font-family:var(--display);font-size:28px;color:var(--gold);text-shadow:4px 4px 0 var(--ink)}
.quick-select{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;max-width:360px;margin-top:6px}
.table tr.gap td{text-align:center;color:var(--muted);padding:2px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;overflow-x:auto}
.bracket-round{display:flex;flex-direction:column;gap:10px;justify-content:space-around}
.bracket-game{background:var(--panel-3);border:3px solid var(--ink);display:flex;flex-direction:column}
.bracket-team{display:grid;grid-template-columns:20px auto 1fr auto;align-items:center;gap:6px;padding:4px 6px;font-size:19px;color:var(--muted)}
.bracket-team+.bracket-team{border-top:2px solid #1d3a4f}
.bracket-team small{font-family:var(--display);font-size:7px;color:var(--gold)}
.bracket-team b{font-family:var(--display);font-size:9px}
.bracket-team.win{color:var(--cream)}.bracket-team.win b{color:var(--green)}
.bracket-team.mine{background:rgba(228,189,98,.14)}
.quick-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}
.quick-opts .field{margin:0}

/* Estrutura */
.facility{display:flex;flex-direction:column;gap:8px}
.facility-art svg{width:100%;max-width:200px;height:auto;image-rendering:pixelated}
.levels{display:flex;gap:4px}.levels i{width:18px;height:10px;background:#2c4658;border:2px solid var(--ink)}.levels i.on{background:var(--gold)}

/* Pós-jogo / fim de temporada */
.post-screen{align-items:center;text-align:center;max-width:880px}
.post-screen>.box,.post-screen>.card-grid{width:100%;text-align:left}
.big-title{font-size:clamp(28px,7vw,56px);text-shadow:4px 4px 0 var(--ink),8px 8px 0 rgba(0,0,0,.35)}
.big-title.good{color:var(--gold)}.big-title.bad{color:var(--red)}
.broadcast-results{width:100%;max-width:1040px}
.results-board{width:100%;isolation:isolate;position:relative;overflow:hidden;border:1px solid #4a646e;background:#0d202e;color:#fff0d7}
.results-board::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#08172282,#081722ef),url('assets/loading/loading-tunnel.webp') center 52%/cover;image-rendering:pixelated}
.results-slate{display:flex;align-items:stretch;gap:12px;min-height:36px;text-align:left;background:#122533;border-bottom:1px solid #4d6570}
.results-station{display:flex;align-items:center;flex-shrink:0;padding:9px 14px;background:#9f2c3b;color:#fff4d8;font:clamp(9px,1.3vw,14px)/1 var(--display);box-shadow:inset 0 -3px #671b2c}
.results-context{display:flex;align-items:center;line-height:1;padding:6px 8px 6px 0;color:#e4efec;font-size:18px}
.results-head{display:grid;justify-items:center;gap:7px;padding:24px 10px 17px}
.results-head .eyebrow{color:#d3e4df}
.results-head h2{font-size:clamp(17px,3.6vw,32px);line-height:1.2;text-shadow:3px 3px #071924}
.results-teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:0 15px 15px}
.results-team{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:12px;background:linear-gradient(115deg,var(--team-shade),#0e1f30 95%);border:1px solid #536675;border-bottom:3px solid var(--team-accent)}
.results-team.winner{border-bottom-color:#ffce77}
.results-team .crest{width:clamp(34px,7vw,69px);height:clamp(34px,7vw,69px)}
.results-team-name{display:grid;gap:5px;min-width:0}
.results-team-name strong{color:#f8f4e7;font-size:clamp(17px,2.4vw,27px);font-weight:400;line-height:1;overflow-wrap:anywhere}
.results-team-name small{font:clamp(7px,1vw,10px)/1.2 var(--display);color:#c7d9d8}
.results-team-score{font:clamp(19px,4.4vw,40px)/1.2 var(--display);color:#fff0d7}
.results-team.winner .results-team-score{color:#ffcf79}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-grid div{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-grid b{font-family:var(--display);font-size:14px;color:var(--cream)}
.stat-grid small{font-family:var(--display);font-size:7px;color:var(--muted)}
.broadcast-results .results-stats{padding:0;background:#112533;border:1px solid #435c68;box-shadow:none}
.results-stats h3{padding:10px 12px;background:#1b3645;color:#ecf0d8;font-size:10px;border-left:3px solid #7ce2ce}
.results-stats .stat-grid{gap:1px;background:#39515f}
.results-stats .stat-grid div{padding:12px 4px;background:#112735;text-align:center;justify-content:center}
.results-stats .stat-grid small{color:#d3e3dc;line-height:1.45}
.watch-comparison{display:grid;gap:1px;background:#39515f}
.watch-comparison div{display:grid;grid-template-columns:1fr minmax(106px,auto) 1fr;align-items:center;gap:9px;padding:9px;background:#112735;text-align:center}
.watch-comparison b{color:#fff0d7;font:11px/1.4 var(--display)}
.watch-comparison small{color:#cfae89;font:8px/1.4 var(--display)}
@media(max-width:580px){
  .results-teams{padding:0 6px 9px}
  .results-team{grid-template-columns:auto minmax(0,1fr);padding:7px;gap:6px}
  .results-team-score{grid-column:1/-1;text-align:center;padding:5px}
}
.rewards{font-family:var(--display);font-size:10px;color:var(--gold);line-height:1.8}
.goal-review{display:flex;flex-direction:column;gap:12px}
.big-note{font-family:var(--display);font-size:12px;line-height:1.6}
.offer{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,12,18,.74);padding:16px;overflow:auto}
.pause-box{width:min(440px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.pause-box .menu-row .btn{width:100%}
.pause-box .goal-line{text-align:left}
.match-pause{width:min(820px,100%);text-align:left;gap:0;padding:0;border:2px solid #456471;border-top:4px solid #ffb66a;background:#0c1f2b;box-shadow:8px 8px 0 #050d14}
.pause-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#183240;border-bottom:1px solid #456471}
.pause-header h2{font-size:13px}
.pause-header .chip{border:1px solid #607780;background:#0c1f2b;color:#ffe6ad}
.pause-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;border-bottom:1px solid #456471}
.pause-score-team{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:linear-gradient(100deg,var(--team-shade),#112733);border-bottom:3px solid var(--team-accent)}
.pause-score-team:last-child{flex-direction:row-reverse;text-align:right;background:linear-gradient(260deg,var(--team-shade),#112733)}
.pause-score-team strong{font:clamp(14px,3vw,22px)/1 var(--display);color:var(--cream)}
.pause-score-team span{min-width:0}
.pause-score-team span b{font:10px/1.6 var(--display);overflow-wrap:anywhere}
.pause-score-team span small{display:block;color:#c8d8d6;line-height:1.05}
.pause-clock{display:grid;place-content:center;gap:5px;padding:0 9px;text-align:center;background:#081823;color:#f6ce8d;font:9px/1.4 var(--display)}
.pause-content{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:12px;padding:12px}
.pause-actions,.pause-info{display:flex;min-width:0;flex-direction:column;gap:7px}
.pause-actions .btn{justify-content:space-between;text-align:left;width:100%;min-height:42px}
.pause-actions .btn.danger{margin-top:auto}
.pause-info{padding:10px;border:1px solid #375766;background:#142e3b}
.pause-info .menu-row,.pause-info .menu-row .btn{min-width:0}
.pause-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center}
.pause-stats div{display:grid;align-content:center;gap:5px;min-height:50px;padding:4px;background:#0a1f2a}
.pause-stats b{font:13px/1 var(--display);color:#ffe2a0}
.pause-stats small{font:7px/1.4 var(--display);color:#c8d8d6;overflow-wrap:anywhere}
.pause-detail{display:grid;gap:10px;padding:16px}
.pause-detail .rules{margin:0}
@media(max-width:580px){
  .pause-content{grid-template-columns:1fr}
  .pause-score-team{padding:7px;gap:5px}
  .pause-score-team .crest{width:23px;height:24px}
  .pause-score-team span small{display:none}
  .pause-clock{padding:0 5px;font-size:7px}
}
.toasts{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 4px 4px 0 var(--line);padding:10px 14px;font-size:20px;animation:toast-in .2s steps(3) both;text-align:center}
.toast.error{box-shadow:inset 4px 4px 0 #6b2f36;color:#ffd2cc}
@keyframes toast-in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.rotate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--night);padding:24px;text-align:center}
.rotate .box{display:flex;flex-direction:column;gap:12px;align-items:center}
.rotate-icon{width:40px;height:64px;border:6px solid var(--cream);animation:rot 1.6s steps(4) infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
.boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:space-between;background:#0b1322;isolation:isolate;overflow:hidden}
.boot::before,.boot::after{content:"";position:absolute;inset:0;z-index:-1}
.boot::before{background:url('assets/loading/one-hand.png') center top/cover no-repeat;image-rendering:pixelated}
.boot[data-stage=match]::before{background-image:url('assets/loading/loading-tunnel.webp');background-position:center}
.boot::after{background:linear-gradient(180deg,#0b1322a8,transparent 26%,transparent 70%,#0b1322b8),repeating-linear-gradient(0deg,#0b13221a 0 1px,transparent 1px 4px)}
.boot-brand{width:min(640px,96%);min-height:clamp(40px,7vw,70px);display:flex;align-items:center;gap:clamp(9px,2vw,19px);padding:6px clamp(14px,4vw,56px);background:linear-gradient(103deg,#0e1a2c 0 91%,#f7d487 91% 92%,#273a54 92%);border-bottom:2px solid #acbbcc;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.boot-brand img{width:clamp(30px,5vw,52px);image-rendering:pixelated}
.boot-brand strong{font:clamp(8px,2vw,20px)/1.45 var(--display);color:#faf0d7}
.boot-footer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 22px;align-items:center;width:min(700px,100%);padding:clamp(9px,2.7vh,24px) clamp(14px,4vw,56px);background:linear-gradient(105deg,#f5edda 0 92%,#bc884a 92% 93%,#e8d8b6 93%);color:#132338;border-top:3px solid #c87844;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);filter:drop-shadow(0 0 12px #0b1322)}
.boot-status{display:grid;gap:6px;min-width:0}
.boot-status small{font:8px/1.45 var(--display);letter-spacing:.06em;color:#884f29}
#boot-message{font:clamp(9px,1.6vw,15px)/1.45 var(--display);color:#192d46}
.boot-track{grid-column:1;max-width:490px;height:9px;border:1px solid #263a51;background:repeating-linear-gradient(90deg,#263a51 0 10px,#3e5369 10px 12px);overflow:hidden}
.boot-track i{display:block;width:40%;height:100%;background:repeating-linear-gradient(90deg,#d28046 0 10px,#f6c677 10px 12px);animation:boot .9s steps(12) infinite}
.boot-field{grid-column:2;grid-row:1/3;width:clamp(45px,9vw,104px);height:clamp(22px,5vw,44px);margin-right:clamp(6px,2vw,20px);border:2px solid #526577;outline:2px solid #bcc8ca;background:linear-gradient(90deg,#f5ebc9aa 10%,transparent 10% 90%,#f5ebc9aa 90%),repeating-linear-gradient(90deg,#2c4a45 0 calc(10% - 1px),#c4cd9c 0 10%)}
@keyframes boot{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (orientation:portrait){.boot[data-stage=startup]::before{background-size:auto 48%;background-position:61% 43%}}
@media (prefers-reduced-motion:reduce){.boot-track i{animation:none}}
#selftest{white-space:pre-wrap;padding:16px;font-size:18px;color:var(--cream);user-select:text}

@media (max-width:900px){
  .split,.split.editor,.hub-main{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .quick-grid{grid-template-columns:1fr}
  .vs-big{text-align:center}
  .quick-opts{grid-template-columns:1fr}
}
@media (max-width:560px){
  html,body{font-size:20px}
  .form-grid,.event-choices,.menu-row{grid-template-columns:1fr}
  .screen-head{grid-template-columns:auto 1fr}
  .head-right{grid-column:1/-1;justify-content:flex-start}
  .goal-line{grid-template-columns:auto 1fr}
  .goal-line .bar{grid-column:1/-1}
  .crest.xl{width:64px;height:72px}.crest.xl b{font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
  .title-screen{gap:12px}
        .btn.big{min-height:48px;font-size:12px;padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-delay:0s!important}}

/* Menus de jogo */

.quick-screen .box,.hub-screen .box{border:1px solid #3b5661;box-shadow:none;background:#102531}
.ui[data-screen=newCareer]{background:radial-gradient(ellipse at 62% 18%,#3b4b58,#101e2b 68%)}
.career-setup{max-width:1100px;gap:11px}
.career-setup .screen-head{background:linear-gradient(#404f5d,#223543 58%,#192d3b);border-color:#617583}

.career-console{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:9px}
.career-picker,.career-preview,.career-form{min-width:0;border:1px solid #546978;background:#112533}
.career-picker{display:grid;align-content:start;grid-template-rows:auto auto auto minmax(170px,1fr);background:#132635}
.career-picker-head{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:13px 12px;background:linear-gradient(#3d505e,#223945);border-bottom:1px solid #6a7a81}
.career-picker-head h3{font:clamp(9px,1.1vw,13px)/1.5 var(--display);color:#f6efdb}

.career-conference{padding:8px 10px;display:grid;grid-template-columns:32px minmax(0,1fr) 32px;gap:5px;align-items:center;background:#182e3b}

.career-conference select{width:100%;min-width:0;padding:4px 8px;min-height:34px;font:20px/1 var(--body);background:#091b2a}
.career-column-head{display:flex;justify-content:space-between;padding:6px 11px;background:#0c1d2b;color:#cbd9d7;border-bottom:1px solid #536876;font:8px/1.4 var(--display)}
.career-schools{position:relative;max-height:316px;overflow:auto;scrollbar-width:thin;scrollbar-color:#69818d #172a37;overscroll-behavior:contain}

.career-school:nth-child(even){background:#1b3242}

.career-school:focus-visible{outline:2px solid #fff0ce;outline-offset:-3px}
.career-school[aria-pressed=true]{background:linear-gradient(#ffe2a6,#e8a25d);border-left-color:#f6f1d7;color:#132634}

.career-school strong{font:9px/1 var(--display)}
.career-preview{display:flex;flex-direction:column;border-top:3px solid var(--team-accent)}
.career-helmet-stage{position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;flex:1;min-height:212px;background:radial-gradient(ellipse at 56% 43%,var(--team-shade),#0c1b2a 87%);overflow:hidden}
.career-helmet-stage::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#091826bc,#11222e34 55%,#1324369c),url('assets/loading/loading-tunnel.webp') center 54%/cover;image-rendering:pixelated;opacity:.49}

.career-school-summary{padding:12px 14px;background:linear-gradient(120deg,var(--team-shade),#142835 78%);border-top:1px solid #637985}
.career-identity{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.career-identity h3{font:clamp(10px,1.35vw,17px)/1.45 var(--display);color:#fff1cf;overflow-wrap:anywhere}
.career-identity small{display:block;color:#bcd1d4;font-size:17px}
.career-strength{display:grid;gap:5px;text-align:right;justify-items:end;color:#f7dc9f}
.career-strength b{font:16px/1 var(--display)}
.career-school-summary p{margin:7px 0 0;font-size:18px;line-height:1.2;color:#d4e0dc}
.career-form{display:grid;grid-template-columns:minmax(145px,1.24fr) minmax(150px,1fr) minmax(115px,.85fr) auto;gap:10px;padding:11px;align-items:end;border-top:2px solid #9aa6a7;background:linear-gradient(#243b48,#152c39)}
.career-form .field{min-width:0;margin:0}
.career-form .btn{white-space:normal;min-height:44px}
.career-form .warn{grid-column:1/-1;margin:0}
.hub-next .hub-match-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
.hub-match-actions .btn.big{width:100%;min-width:0;padding-inline:8px;font-size:clamp(9px,1.1vw,14px)}
@media(max-width:730px){
  .career-form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .career-helmet-stage canvas{width:min(84%,245px)}
}
@media(max-width:540px){
  .career-console{grid-template-columns:minmax(0,1fr)}
  .career-picker{grid-template-rows:auto auto auto minmax(0,1fr)}
  .career-schools{max-height:198px}
  .career-helmet-stage{min-height:158px}
  .career-helmet-stage canvas{width:min(80%,205px)}

}
.hub-screen{max-width:1280px}
.hub-screen .hub-bar{border-top:3px solid var(--team-accent);background:repeating-linear-gradient(132deg,transparent 0 22px,#e6efde08 22px 24px),linear-gradient(100deg,var(--team-shade),#102531 78%)}

.hub-screen .hub-next{position:relative;isolation:isolate;overflow:hidden;justify-content:flex-end;padding:20px;gap:12px;border-top:3px solid #ebac73;min-height:370px}
.hub-next .eyebrow,.hub-next h3{text-shadow:2px 2px #091724}
.hub-next .goal-mini{padding:8px 10px;background:#081722dc;border:1px solid #3b535b}
.hub-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.hub-card-art{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated;pointer-events:none}
.hub-screen .hub-next::after,.hub-card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#09142128 0%,#0914216b 37%,#091421f5 73%)}
.hub-card{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;min-width:0;min-height:106px;padding:10px;text-align:left;color:var(--cream);background:#122837;border:1px solid #49616f;cursor:pointer}
.hub-card:nth-child(-n+4){grid-column:span 2;min-height:140px;padding:13px}
.hub-card:hover,.hub-card:focus-visible{border-color:#7ce2ce}
.hub-card:focus-visible{outline:2px solid #7ce2ce;outline-offset:1px}
.hub-card:hover::after,.hub-card:focus-visible::after{background:linear-gradient(180deg,#13273502 0%,#19354060 45%,#0a212cfa 100%)}
.hub-card-copy{display:grid;gap:4px;overflow-wrap:anywhere;text-shadow:2px 2px #071621}
.hub-card-copy b{font:clamp(8px,1vw,11px)/1.4 var(--display)}
.hub-card-copy small{font:18px/1.05 var(--body);color:#deece4}
.hub-card::before{content:"";position:absolute;bottom:0;left:0;width:32px;height:2px;background:#7ce2ce}
.hub-screen .matchup{display:grid;grid-template-columns:1fr auto 1fr;justify-items:center;gap:8px;margin-top:8px;padding:8px;background:linear-gradient(100deg,var(--team-left),#0b202bd9 48%,#0b202bd9 52%,var(--team-right));border:1px solid #4c6269}
.quick-screen .quick-grid{position:relative;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quick-screen .quick-side{padding:0;display:flex;gap:0;overflow:hidden;border-top:3px solid var(--team-accent)}
.quick-stage{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;width:100%;padding:42px 14px 12px;background:repeating-linear-gradient(145deg,transparent 0 11px,#ffffff07 11px 13px),linear-gradient(120deg,#0b1925,var(--team-shade));border-bottom:1px solid #3b5661}
.quick-stage::after{content:"";position:absolute;bottom:0;left:0;width:42%;height:2px;background:var(--team-accent)}
.quick-stage-role{position:absolute;top:14px;left:14px;color:#f3ecce}
.quick-stage-rating{position:absolute;top:12px;right:14px;display:grid;gap:3px;padding:4px 6px;background:#0a1a24;border:1px solid #4d666d;font:7px/1.2 var(--display);color:#bccece}
.quick-stage-rating b{font:13px/1.05 var(--display);color:#f3c37e}
.quick-art{display:flex;justify-content:center;min-width:0}
.quick-helmet{width:min(100%,315px);height:auto;aspect-ratio:68/48;image-rendering:pixelated}
.quick-team-name{display:flex;align-items:center;gap:8px;justify-content:center}
.quick-team-name .crest{width:34px;height:34px}
.quick-side-info{width:100%;display:grid;justify-items:center;gap:8px;padding:14px}
.quick-side-info p{margin:0}
.quick-side-info .eyebrow{color:#9edbd2}
.quick-side-info .quick-select{margin-top:4px}
.dice-face{display:grid;grid-template:repeat(3,2px)/repeat(3,2px);gap:2px;padding:3px;border:1px solid #fff1cb;box-shadow:1px 1px 0 #091722}
.dice-face i{background:#fff1cb}
.dice-face i:nth-child(1){grid-area:1/1}
.dice-face i:nth-child(2){grid-area:1/3}
.dice-face i:nth-child(3){grid-area:2/2}
.dice-face i:nth-child(4){grid-area:3/1}
.dice-face i:nth-child(5){grid-area:3/3}
.quick-screen .vs-big{position:absolute;z-index:1;left:50%;top:111px;transform:translate(-50%,-50%);padding:10px 7px;font-size:17px;color:#ffc97d;background:#0e222d;border:1px solid #56656a;text-shadow:none}
.quick-screen .quick-opts{border-left:3px solid #7ce2ce}
.championship-screen .box{background:#102531;border:1px solid #3b5661;box-shadow:none}
.championship-screen .championship-team,.championship-screen .championship-match{border-top:3px solid var(--team-accent);background:linear-gradient(110deg,var(--team-shade),#102531)}
.championship-team{display:grid;justify-items:center;align-content:center;gap:10px;text-align:center}
.championship-team p{margin:0}
.championship-match{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.championship-matchup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.championship-matchup b{font:10px/1 var(--display);color:#f1bd77}
.championship-table{margin-top:12px;max-height:360px}
.championship-table thead{position:sticky;top:0;background:#132b38}
.championship-screen .bracket{margin-top:14px}
.challenge-picker{display:grid;gap:10px}
.challenge-picker h3{font:clamp(10px,1.2vw,15px)/1.4 var(--display);color:#fff0ce}
.challenge-academy-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.challenge-academy{position:relative;isolation:isolate;display:grid;grid-template-rows:1fr auto auto;align-items:end;gap:8px;overflow:hidden;min-width:0;min-height:225px;padding:10px;text-align:left;color:#fff1d6;background:linear-gradient(145deg,var(--team-shade),#132c40);border:1px solid #657981;border-bottom:3px solid var(--team-accent);cursor:pointer}
.challenge-academy::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#081723 12%,#10233405 85%),url('assets/loading/loading-tunnel.webp') center 42%/cover;opacity:.46;image-rendering:pixelated}
.challenge-academy canvas{display:block;align-self:center;justify-self:center;width:min(100%,170px);height:auto;aspect-ratio:68/48;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #0b182a)}
.challenge-academy:hover,.challenge-academy:focus-visible{border-color:#f7cf87}
.challenge-academy:focus-visible{outline:2px solid #f7cf87;outline-offset:1px}
.challenge-academy-info{display:grid;gap:3px}
.challenge-academy-info strong{font:clamp(8px,1vw,12px)/1.45 var(--display);overflow-wrap:anywhere}
.challenge-academy-info small{font-size:17px;color:#c3d8de;line-height:1}
.challenge-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.challenge-progress progress{display:block;appearance:none;width:100%;height:8px;border:1px solid #63808c;background:#091824;color:#7de2cc}
.challenge-progress progress::-webkit-progress-bar{background:#091824}
.challenge-progress progress::-webkit-progress-value{background:#7de2cc}
.challenge-progress progress::-moz-progress-bar{background:#7de2cc}
.challenge-progress span{font:7px/1.3 var(--display);color:#d8e7e8}
.challenge-banner{display:grid;grid-template-columns:auto 1fr minmax(140px,.35fr);align-items:center;gap:14px;padding:13px;background:linear-gradient(135deg,var(--team-shade),#142f49);border:1px solid #6c8491;border-top:3px solid var(--team-accent)}
.challenge-banner h3,.challenge-card h3{font:clamp(10px,1.6vw,15px)/1.5 var(--display)}
.challenge-banner p{margin:3px 0 0;color:#d3e1e9}
.challenge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.challenge-card{display:grid;gap:9px;min-width:0;padding:12px;background:linear-gradient(145deg,#253f57,#0f2536 62%);border:1px solid #61788b}
.challenge-card.earned{border-color:#7de2cc}
.challenge-card header,.challenge-unlock{display:flex;gap:10px;align-items:center}
.challenge-card .eyebrow{color:#b8d5e6}
.challenge-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:7px;background:linear-gradient(130deg,var(--team-shade),#071a2d);border:1px solid #566e81}
.challenge-score span{display:flex;gap:4px;align-items:center;font:9px/1 var(--display)}
.challenge-score span:last-child{justify-content:flex-end}
.challenge-score b{font:clamp(12px,2vw,20px)/1.3 var(--display);color:#ffe1a0}
.challenge-condition{display:flex;justify-content:space-between;gap:8px;font:8px/1.4 var(--display);color:#c9e0e8}
.challenge-cup{position:relative;flex:none;width:44px;height:44px;background:linear-gradient(140deg,#425a70,#152a40);border:1px solid #5e7790;--cup:#d7804d}
.challenge-cup.silver{--cup:#bcd2dd}.challenge-cup.gold{--cup:#f5c467}
.challenge-cup.earned{border-color:#8de2d0;background:linear-gradient(140deg,#486f79,#163643)}
.challenge-cup::before{content:"";position:absolute;inset:7px;background:linear-gradient(125deg,#f9edcf,var(--cup) 42%,#455568 83%);clip-path:polygon(19% 4%,81% 4%,81% 20%,100% 20%,100% 43%,93% 43%,93% 55%,78% 55%,78% 66%,58% 66%,58% 83%,76% 83%,76% 94%,24% 94%,24% 83%,42% 83%,42% 66%,22% 66%,22% 55%,7% 55%,7% 43%,0 43%,0 20%,19% 20%)}
.challenge-unlock{width:100%;padding:10px;text-align:left;background:linear-gradient(125deg,#25465e,#102b3e);border:1px solid #769aa9}
.challenge-unlock b{display:block;color:#fbe7b6;font:10px/1.5 var(--display)}
.league-screen{max-width:1210px;gap:10px}
.league-screen .screen-head{background:linear-gradient(#3c5363,#203746);border-color:#6b7d85}
.league-screen .screen-head::after{background:#f7bc72}
.league-console{display:grid;grid-template-columns:minmax(164px,.25fr) minmax(0,1fr);gap:9px;align-items:start}
.league-sidebar,.league-board{min-width:0;border:1px solid #607885;background:#112633}
.league-program{position:relative;isolation:isolate;display:grid;justify-items:center;gap:9px;padding:16px 9px;text-align:center;background:linear-gradient(140deg,var(--team-shade),#13293d);border-top:3px solid var(--team-accent);border-bottom:1px solid #627986}
.league-program::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#0a1826c9,#0b1d2960),url('assets/loading/loading-tunnel.webp') center/cover;image-rendering:pixelated;opacity:.52}
.league-program h3{font:clamp(9px,1.2vw,14px)/1.5 var(--display);color:#fff0cc}
.league-record{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.league-record span{display:grid;gap:5px;padding:7px 2px;background:#0b1c2b;color:#cee1e1;font:7px/1.3 var(--display)}
.league-record b{font-size:13px;color:#ffd78b}
.league-tabs{display:grid}
.league-tabs button{width:100%;min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:5px;padding:8px;text-align:left;font:9px/1.4 var(--display);color:#e0ece6;background:#1a3445;border:0;border-bottom:1px solid #526a78;cursor:pointer}
.league-tabs button:hover,.league-tabs button:focus-visible{background:#2b5062}
.league-tabs button[aria-pressed=true]{background:linear-gradient(#ffe1a0,#e4a362);color:#132332}
.league-tabs button:last-child{border-bottom:0}
.league-board{padding:8px}
.league-board .table-scroll{max-height:490px}
.league-board .table{margin:0;border:1px solid #415e6d}
.league-board .table thead{position:sticky;top:0;z-index:1;background:#354f5c;box-shadow:0 1px 0 #71848b}
.league-board .table td,.league-board .table th{padding:6px 8px}
.league-board .table tbody tr:nth-child(even){background:#172f41}
.league-board .table tbody tr.own{background:#3f5d5e;box-shadow:inset 3px 0 #f6c47e}
.league-board .table tbody tr.own td{color:#fff1cd}
.league-board .conf-tabs{gap:4px;margin:0 0 8px}
.league-board .conf-tabs .btn{min-height:29px;padding:4px 6px}
.league-board p{margin:9px 3px 2px}
@media(max-width:690px){
  .league-console{grid-template-columns:minmax(0,1fr)}
  .league-program{grid-template-columns:auto 1fr minmax(82px,.5fr);justify-items:start;align-items:center;text-align:left;gap:7px;padding:6px}
  .league-program .crest{width:38px;height:40px}
  .league-record{text-align:center}
  .league-tabs{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
  .league-tabs button{justify-content:center;text-align:center;border-right:1px solid #526a78;font-size:7px}
  .league-tabs button:last-child{border-right:0;border-bottom:1px solid #526a78}
  .league-tabs button b{display:none}
}
@media(max-width:950px){.challenge-academy-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){
  .challenge-academy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .challenge-academy{min-height:158px}
  .challenge-grid{grid-template-columns:minmax(0,1fr)}
  .challenge-banner{grid-template-columns:auto minmax(0,1fr);gap:8px}
  .challenge-banner .challenge-progress{grid-column:1/-1}
}
@media(max-width:700px){
  .title-screen{justify-content:flex-start}

  .mode-tile[data-mode=championship] .mode-image{object-position:75% center}
  .mode-tile{min-height:145px;padding:8px 9px}

}
@media(max-width:560px){
  .main-nav{flex-wrap:wrap}
  .main-nav nav{gap:4px}
  .main-nav .btn{padding:5px 7px}
  .quick-screen .quick-grid{gap:8px;align-items:stretch}
  .quick-screen .vs-big{top:66px;padding:4px 3px;font-size:8px;pointer-events:none}
  .quick-stage{grid-template-rows:1fr auto;gap:4px;padding:25px 6px 6px}
  .quick-stage-role{top:6px;left:6px;font-size:7px;letter-spacing:0}
  .quick-stage-rating{top:5px;right:6px;padding:1px 3px;font-size:0}
  .quick-stage-rating b{font-size:9px}
  .quick-stage .quick-art{grid-row:1;grid-column:1/-1}
  .quick-stage .btn{grid-row:2;min-height:32px;min-width:32px;padding:4px}
  .quick-stage .btn:last-child{grid-column:3}
  .quick-side-info{padding:8px;gap:6px}
  .quick-team-name{flex-direction:column;gap:5px}
  .quick-team-name h3{font-size:9px;overflow-wrap:anywhere}
  .quick-side-info p{font-size:14px}
  .quick-side-info .quick-select{grid-template-columns:minmax(0,1fr) auto;gap:4px}
  .quick-select .btn{padding:4px}
  .quick-select select{min-width:0}
  .hub-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hub-card:nth-child(-n+4){grid-column:auto}
  .hub-screen .hub-next{padding:14px}
}
@media(max-height:520px) and (orientation:landscape){
  .title-screen{justify-content:flex-start}
}

function numberFor(position, rng, taken) {

  const pool = [];
  for (let i = 0; i < r.length; i += 2) for (let n = r[i]; n <= r[i + 1]; n++) if (!taken.has(n)) pool.push(n);
  if (!pool.length) for (let n = 1; n <= 99; n++) if (!taken.has(n)) pool.push(n);
  return pool.length ? pick(pool, rng) : 1 + Math.floor(rng() * 99);

function makeAthlete(rng, id, position, baseRating, year = 1) {

function shuffled(list, rng) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/** Rodadas de todos contra todos (método do círculo), em ordem embaralhada. Com número ímpar, um time folga por rodada. */
function roundRobin(ids, rng) {
  const order0 = shuffled(ids, rng);
  if (order0.length % 2) order0.push(null);
  const n = order0.length, rounds = [];
  let order = order0;
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) if (order[i] && order[n - 1 - i]) pairs.push([order[i], order[n - 1 - i]]);
    rounds.push(pairs);
    order = [order[0], order[n - 1], ...order.slice(1, n - 1)];
  }
  return shuffled(rounds, rng);
}
const pairKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
/** Emparelha os times livres da semana em jogos fora da conferência, evitando revanches e preferindo forças parecidas. */
function pairOutside(pool, met, rng) {
  let best = null;
  for (let attempt = 0; attempt < 24 && !(best && best.bad === 0); attempt++) {
    const left = shuffled(pool, rng), pairs = [];
    let bad = 0;
    while (left.length) {
      const a = left.shift(), ta = TEAM_BY_ID.get(a);
      const ok = left.filter((b) => (ta.conf === 'ind' || TEAM_BY_ID.get(b).conf !== ta.conf) && !met.has(pairKey(a, b)));
      let b;
      if (ok.length) b = ok.slice(0, 6).sort((x, y) => Math.abs(TEAM_BY_ID.get(x).power - ta.power) - Math.abs(TEAM_BY_ID.get(y).power - ta.power))[rng() < 0.7 ? 0 : Math.min(1, ok.length - 1)];
      else { b = left[0]; bad++; }
      left.splice(left.indexOf(b), 1);
      pairs.push([a, b]);
    }
    if (!best || bad < best.bad) best = { pairs, bad };
  }
  return best ? best.pairs : [];
}
/** Calendário nacional da temporada regular: todo time joga exatamente uma vez por semana. */
function makeSchedule(season, seed) {
  const rng = makeRng(hashString(`schedule:${season}:${seed}`));
  const rounds = CONFERENCES.filter((cf) => cf.id !== 'ind').map((cf) => roundRobin(teamIdsInConf(cf.id), rng));
  const games = [], met = new Set();
  for (let w = 0; w < REG_WEEKS; w++) {
    const busy = new Set(), week = [];
    if (w >= CONF_WINDOW) for (const list of rounds) for (const [a, b] of list[w - CONF_WINDOW] || []) { week.push([a, b]); busy.add(a); busy.add(b); }
    week.push(...pairOutside(BASE_TEAMS.filter((t) => !busy.has(t.id)).map((t) => t.id), met, rng));
    week.forEach(([a, b], i) => {
      const flip = rng() < 0.5;
      met.add(pairKey(a, b));
      games.push({ id: `${season}-w${w}-${i}`, week: w, stage: 'regular', homeId: flip ? b : a, awayId: flip ? a : b, played: false, homeScore: null, awayScore: null });
    });
  }
  return games;
}

function teamStrength(c) {
  const eff = (p) => p.rating * (0.72 + clamp(p.condition, 0, 100) / 100 * 0.18 + clamp(p.morale, 0, 100) / 100 * 0.1);
  const pos = (position, count = 1) => {
    const list = c.roster.filter((p) => p.position === position && isAvailable(p)).sort((a, b) => eff(b) - eff(a));
    let sum = 0;
    for (let i = 0; i < count; i++) sum += list[i] ? eff(list[i]) : 1.6;
    return sum / count;
  };
  const offense = (pos('QB') * 1.4 + pos('RB') + pos('WR', 2) * 1.3 + pos('TE') * 0.75 + pos('OL') * 0.55) / 5;
  const defense = (pos('DL') + pos('LB') * 1.1 + pos('DB') * 1.2) / 3.3;
  return { offense: roundTo(clamp(offense, 1, 5)), defense: roundTo(clamp(defense, 1, 5)) };

/** Força usada na simulação e no ranking: a do editor para a CPU, a do elenco para o seu time. */
function powerLookup(c) {

/** Campanha de cada time (geral e na conferência) a partir dos jogos disputados. */
function recordTable(c) {
  const table = new Map(BASE_TEAMS.map((t) => [t.id, { teamId: t.id, wins: 0, losses: 0, confWins: 0, confLosses: 0, pf: 0, pa: 0, opp: [], results: [] }]));
  for (const g of c.schedule) {
    if (!g.played) continue;
    const h = table.get(g.homeId), a = table.get(g.awayId);
    if (!h || !a) continue;
    const homeWon = g.homeScore > g.awayScore;
    h.pf += g.homeScore; h.pa += g.awayScore; a.pf += g.awayScore; a.pa += g.homeScore;
    if (homeWon) { h.wins++; a.losses++; } else { a.wins++; h.losses++; }
    if (isConfGame(g)) { if (homeWon) { h.confWins++; a.confLosses++; } else { a.confWins++; h.confLosses++; } }
    h.opp.push(g.awayId); a.opp.push(g.homeId);
    h.results.push([g.awayId, homeWon]); a.results.push([g.homeId, !homeWon]);

    .sort((x, y) => (y.confWins - y.confLosses) - (x.confWins - x.confLosses) || y.confWins - x.confWins || (y.wins - y.losses) - (x.wins - x.losses) || (y.pf - y.pa) - (x.pf - x.pa) || y.power - x.power || x.teamId.localeCompare(y.teamId))

function nationalRanking(c, table = recordTable(c)) {
  const power = powerLookup(c);
