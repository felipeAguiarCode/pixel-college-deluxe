    const r = table.get(t.id), gp = r.wins + r.losses;
    const quality = r.results.reduce((sum, [opp, won]) => sum + (won ? 0.6 + power(opp) * 0.35 : -(1.8 - power(opp) * 0.25)), 0);
    const bigConf = CONF_BY_ID.get(t.conf)?.power4 || t.id === 'notredame' ? 0.8 : 0;
    const score = power(t.id) * 1.2 + quality + bigConf + (champs.has(t.id) ? 1 : 0) + clamp((r.pf - r.pa) / Math.max(gp, 1), -21, 21) * 0.03;
    return { ...r, team: getTeam(t.id), score };
  }).sort((x, y) => y.score - x.score || x.teamId.localeCompare(y.teamId)).map((row, i) => ({ ...row, rank: i + 1 }));
}
const rankOf = (c, id = c.teamId, ranking = nationalRanking(c)) => ranking.find((r) => r.teamId === id)?.rank || TEAM_COUNT;
const confRankOf = (c, id = c.teamId) => conferenceStandings(c, confOf(id)).find((r) => r.teamId === id)?.rank || 1;

function simulateScore(homePower, awayPower, rng) {
  const h = Math.max(0, Math.round(1.8 + (homePower - awayPower) * 0.38 + rng() * 3.2));
  const a = Math.max(0, Math.round(1.4 + (awayPower - homePower) * 0.38 + rng() * 3.2));
  let hs = h * 7 + Math.floor(rng() * 3) * 3, as = a * 7 + Math.floor(rng() * 3) * 3;
  if (hs === as) { if (rng() > 0.5) hs += 3; else as += 3; }
  return { homeScore: hs, awayScore: as };
}
function simulateLeagueGame(c, g, power = powerLookup(c)) {
  if (g.played) return;
  Object.assign(g, simulateScore(power(g.homeId) + (g.neutral ? 0 : 0.15), power(g.awayId), careerRng(c, g.id)), { played: true });
}
/** Simula os jogos ainda não disputados de uma semana (nunca o do seu time, que já foi jogado antes de avançar). */
function simulateWeek(c, week) {
  const power = powerLookup(c);
  for (const g of c.schedule) if (g.week === week && !g.played) simulateLeagueGame(c, g, power);
}
const winnerOf = (g) => (g.homeScore > g.awayScore ? g.homeId : g.awayId);
const isMine = (c, g) => g.homeId === c.teamId || g.awayId === c.teamId;

function finishSeason(c) {
  const final = c.schedule.find((g) => g.stage === 'final');
  if (final && !final.played) simulateLeagueGame(c, final);
  const table = recordTable(c);
  const ranking = nationalRanking(c, table);
  c.championId = final ? winnerOf(final) : ranking[0].teamId;
  c.phase = 'offseason';
  const rank = rankOf(c, c.teamId, ranking);
  const confRank = conferenceStandings(c, confOf(c.teamId), table).find((r) => r.teamId === c.teamId)?.rank || 1;
  const champion = c.championId === c.teamId;
  const playoff = c.playoffSeeds.includes(c.teamId);
  if (!c.history.some((h) => h.season === c.season && h.teamId === c.teamId)) {
    const rewardCC = champion ? 22 : playoff ? 12 : rank <= 25 ? 9 : 6;
    const rewardFunds = champion ? 18000 : playoff ? 11000 : rank <= 25 ? 9000 : 7000;
    c.cc += rewardCC;
    c.scholarship = Math.min(c.scholarshipCap, c.scholarship + rewardFunds);
    evaluateSeason(c, rank, champion);
    c.history.push({ season: c.season, teamId: c.teamId, conf: confOf(c.teamId), wins: c.record.wins, losses: c.record.losses, rank, confRank, playoff, championId: c.championId, champion, rewardCC, rewardFunds, goalsDone: c.goals.filter((g) => g.status === 'done').length, confidence: c.confidence });
    c.lastNotice = champion ? `CAMPEÕES NACIONAIS! +${rewardCC} CC e ${money(rewardFunds)} em bolsas.` : `Temporada concluída em #${rank} no ranking. +${rewardCC} CC e ${money(rewardFunds)} em bolsas.`;
  }
  c.event = null;
}

const postGame = (c, week, stage, slot, homeId, awayId, extra = {}) => ({ id: `${c.season}-${stage}-${slot}`, week, stage, slot, homeId, awayId, played: false, homeScore: null, awayScore: null, neutral: true, ...extra });
const stageWinners = (c, stage) => c.schedule.filter((g) => g.stage === stage && g.played).sort((a, b) => a.slot - b.slot).map(winnerOf);

/** Monta os confrontos de uma semana da pós-temporada a partir dos resultados anteriores. */
function createPostseasonWeek(c, week) {
  const stage = POST_STAGES[week - REG_WEEKS];
  if (!stage || c.schedule.some((g) => g.week === week)) return;
  if (stage === 'conf') {
    const table = recordTable(c);
    CONFERENCES.filter((cf) => cf.id !== 'ind').forEach((cf, i) => {
      const [a, b] = conferenceStandings(c, cf.id, table);
      c.schedule.push(postGame(c, week, 'conf', i, a.teamId, b.teamId, { conf: cf.id }));
    });
    return;
  }
  if (stage === 'playoff1') {
    const table = recordTable(c);
    const ranking = nationalRanking(c, table);
    const champs = new Set(stageWinners(c, 'conf'));
    // Os 5 campeões de conferência mais bem colocados têm vaga garantida; o resto entra pelo ranking. Cabeças de chave seguem o ranking.
    const auto = ranking.filter((r) => champs.has(r.teamId)).slice(0, 5).map((r) => r.teamId);
    const atLarge = ranking.map((r) => r.teamId).filter((id) => !auto.includes(id)).slice(0, 12 - auto.length);
    const field = new Set([...auto, ...atLarge]);
    const seeds = ranking.map((r) => r.teamId).filter((id) => field.has(id));
    c.playoffSeeds = seeds;
    // 5×12, 6×11, 7×10, 8×9. O slot aponta o cabeça de chave que espera nas quartas (1º, 2º, 3º, 4º).
    [[7, 8, 0], [6, 9, 1], [5, 10, 2], [4, 11, 3]].forEach(([h, a, slot]) => c.schedule.push(postGame(c, week, 'playoff1', slot, seeds[h], seeds[a], { neutral: false })));
    const mine = table.get(c.teamId);
    if (!field.has(c.teamId) && mine.wins >= 6) {
      const myRank = rankOf(c, c.teamId, ranking);
      const rng = careerRng(c, 'bowl');
      const pool = ranking.filter((r) => r.teamId !== c.teamId && !field.has(r.teamId) && r.wins >= 6 && !mine.opp.includes(r.teamId));
      const opp = pool.filter((r) => r.team.conf !== confOf(c.teamId)).sort((a, b) => Math.abs(a.rank - myRank) - Math.abs(b.rank - myRank))[0] || pool[0];
      if (opp) c.schedule.push(postGame(c, week, 'bowl', 0, c.teamId, opp.teamId, { bowlName: pick(BOWL_NAMES, rng) }));
    }
    return;
  }
  const seeds = c.playoffSeeds;
  if (stage === 'quarter') { const w = stageWinners(c, 'playoff1'); [0, 1, 2, 3].forEach((s) => c.schedule.push(postGame(c, week, 'quarter', s, seeds[s], w[s]))); return; }
  if (stage === 'semifinal') { const w = stageWinners(c, 'quarter'); c.schedule.push(postGame(c, week, 'semifinal', 0, w[0], w[3]), postGame(c, week, 'semifinal', 1, w[1], w[2])); return; }
  if (stage === 'final') { const w = stageWinners(c, 'semifinal'); c.schedule.push(postGame(c, week, 'final', 0, w[0], w[1])); }
}

function postseasonNotice(c, g) {
  const opp = getTeam(g.homeId === c.teamId ? g.awayId : g.homeId);
  if (g.stage === 'conf') return `Final da ${CONF_BY_ID.get(g.conf).name}! Contra ${opp.name}, valendo o título da conferência.`;
  if (g.stage === 'bowl') return `Convite para o ${g.bowlName}! Fora do playoff, mas a temporada ainda tem uma decisão.`;
  if (g.stage === 'playoff1') return `No playoff como cabeça de chave #${c.playoffSeeds.indexOf(c.teamId) + 1}! Primeira rodada contra ${opp.name}.`;
  if (g.stage === 'quarter') return c.playoffSeeds.indexOf(c.teamId) < 4 && !c.schedule.some((x) => x.stage === 'playoff1' && isMine(c, x)) ? `Cabeça de chave #${c.playoffSeeds.indexOf(c.teamId) + 1}: folga na 1ª rodada e quartas contra ${opp.name}.` : `Quartas de final contra ${opp.name}!`;
  if (g.stage === 'semifinal') return `Semifinal nacional contra ${opp.name}!`;
  if (g.stage === 'final') return `Finalistas! ${opp.name} é o último obstáculo rumo ao título nacional.`;
  return '';
}

/** Avança o calendário até a próxima partida do seu time, simulando as semanas em que ele não joga. */
function advanceWeek(c) {
  for (let guard = 0; guard <= LAST_WEEK + 1; guard++) {
    simulateWeek(c, c.week);
    if (c.week >= LAST_WEEK) break;
    c.week++;
    if (c.week >= REG_WEEKS) { c.phase = 'postseason'; createPostseasonWeek(c, c.week); }
    const g = nextMatch(c);
    if (g) { if (g.stage !== 'regular') c.lastNotice = postseasonNotice(c, g); return; }
  }
  finishSeason(c);
}

function developRoster(c, res, game) {
  const rng = careerRng(c, `${game.id}:development`);
  const plan = { light: { xp: 9, fatigue: 2, gpa: 0.05 }, normal: { xp: 15, fatigue: 7, gpa: 0.13 }, hard: { xp: 23, fatigue: 14, gpa: 0.23 } }[c.training] || { xp: 15, fatigue: 7, gpa: 0.13 };
  const st = res.stats || {};
  const passYds = num(st.passingYards), rushYds = num(st.rushingYards);
  for (const p of c.roster) {
    const played = isAvailable(p), injured = num(p.injury) > 0;
    if (injured) p.injury = Math.max(0, p.injury - 1);
    p.condition = clamp(p.condition + c.facilities.rehab * 3 + (played ? -plan.fatigue - 4 : 14), 18, 100);
    p.gpa = roundTo(clamp(p.gpa + (played ? -plan.gpa : 0.38), 0, p.academicLimit), 2);
    p.morale = Math.round(clamp(p.morale + (res.won ? 5 : -3) + (!played && !injured ? -1 : 0), 15, 100));
    p.xp += Math.round((played ? plan.xp : plan.xp * 0.6) + c.facilities.training * 3 + (res.won ? 4 : 0));
    while (p.xp >= 100) {
      p.xp -= 100;
      p.rating = roundTo(Math.min(p.potential, p.rating + 0.2));
      const k = pick(['speed', 'strength', 'skill', 'stamina'], rng);
      p[k] = Math.min(10, p[k] + 1);
    }
    if (played) {
      p.stats.games++;
      if (p.position === 'QB') { p.stats.yards += passYds; p.stats.touchdowns += num(st.passingTDs); }
      if (p.position === 'RB') { p.stats.yards += rushYds; p.stats.touchdowns += num(st.rushingTDs); }
      if (p.position === 'WR' || p.position === 'TE') p.stats.yards += Math.round(passYds * (p.position === 'WR' ? 0.35 : 0.3));
      if (['DL', 'LB', 'DB'].includes(p.position)) p.stats.tackles += 2 + Math.floor(rng() * 6);
      if (rng() < 0.018 + Math.max(0, 55 - p.condition) * 0.0015) p.injury = 1;
    }
  }
}

function maybeCreateEvent(c) {
  if (c.event || c.phase === 'offseason' || c.week % 2 !== 0) return;
  const rng = careerRng(c, `event-${c.week}`);
  const target = [...c.roster].sort((a, b) => a.gpa - b.gpa)[0];
  const kind = target && target.gpa < 2.7 ? 'study' : ['sponsor', 'community', 'study'][Math.floor(rng() * 3)];
  const base = { id: `${c.season}-event-${c.week}`, kind, targetId: target?.id };
  if (kind === 'study' && target) c.event = { ...base, title: 'Semana de provas', text: `${target.name} precisa de tempo para uma prova importante. Como organizar a semana?`, choices: [{ label: 'Priorizar os estudos', effectText: '+0,6 GPA · +8 condição' }, { label: 'Treino acompanhado', effectText: '+12 XP · +0,2 GPA' }] };
  else if (kind === 'community') c.event = { ...base, title: 'O campus veste a camisa', text: 'Os estudantes organizaram uma tarde de atividades com o elenco. Você pode aproximar o time da torcida.', choices: [{ label: 'Participar com o time', effectText: '+10 moral · +3 CC' }, { label: 'Sessão de recuperação', effectText: '+12 condição para todos' }] };
  else c.event = { ...base, kind: 'sponsor', title: 'Apoio dos ex-alunos', text: 'A associação de ex-alunos quer investir no programa. Escolha onde esse apoio será mais útil.', choices: [{ label: 'Fundo de bolsas', effectText: '+$8.000 em bolsas' }, { label: 'Estrutura do programa', effectText: '+8 CC' }] };
}

function addMatchToSeasonStats(c, stats, my, opp, stage) {
  const s = c.seasonStats;
  for (const k of SUMMED_STATS) s[k] += Math.round(num(stats?.[k]));
  s.games++;
  if (my > opp) { s.wins++; if (stage === 'regular') s.regularWins++; s.biggestWin = Math.max(s.biggestWin, my - opp); } else s.losses++;
  s.pointsFor += my; s.pointsAgainst += opp;
  s.maxPointsGame = Math.max(s.maxPointsGame, my);
  s.longestPlay = Math.max(s.longestPlay, Math.round(num(stats?.longestPlay)));
}

/** Aplica o resultado de uma partida da carreira (porte de `wd` do original + metas). */
function applyMatchResult(c, res) {
  if (!c || !res || c.phase === 'offseason') return c;
  const game = res.matchId ? c.schedule.find((g) => g.id === res.matchId) : nextMatch(c);
  if (!game || game.played || game.week !== c.week || !isMine(c, game) || c.processedMatches.includes(game.id)) return c;
  if (!Number.isFinite(Number(res.homeScore)) || !Number.isFinite(Number(res.awayScore))) return c;
  const before = goalSnapshot(c);
  let my = Math.max(0, Math.round(Number(res.homeScore))), opp = Math.max(0, Math.round(Number(res.awayScore)));
  if (my === opp) { if (res.won !== false) my += 2; else opp += 2; }
  const won = my > opp;
  game.homeScore = game.homeId === c.teamId ? my : opp;
  game.awayScore = game.homeId === c.teamId ? opp : my;
  game.played = true;
  c.processedMatches.push(game.id);
  if (won) c.record.wins++; else c.record.losses++;
  const credits = (won ? 6 : 3) + Math.floor(c.facilities.stadium / 2);
  const funds = (won ? 4500 : 2500) + c.facilities.stadium * 500;
  c.cc += credits;
  c.scholarship = Math.min(c.scholarshipCap, c.scholarship + funds);
  addMatchToSeasonStats(c, res.stats, my, opp, game.stage);
  const opponentId = game.homeId === c.teamId ? game.awayId : game.homeId;
  c.lastResult = { matchId: game.id, myScore: my, oppScore: opp, won, opponentId, credits, funds, week: game.week, stage: game.stage, stats: { ...(res.stats || {}) }, simulated: !!res.simulated, forfeit: !!res.forfeit, overtime: !!res.overtime, season: c.season };
  developRoster(c, c.lastResult, game);
  simulateWeek(c, c.week);
  c.lastNotice = `${won ? 'Vitória' : 'Partida encerrada'}: ${my} × ${opp}. +${credits} CC e +${money(funds)} em bolsas.`;
  refreshGoals(c);
  advanceWeek(c);
  maybeCreateEvent(c);
  refreshGoals(c);
  c.lastResult.goals = goalDiffs(c, before);
  saveCareer(c);
  return c;
}

function recruitAthlete(c, id) {
  const r = c.recruits.find((p) => p.id === id && !p.recruited);
  if (!r) return result(c, false, 'Esse atleta já foi recrutado ou não está disponível.');
  if (c.roster.length >= MAX_ROSTER) return result(c, false, `Elenco completo: ${MAX_ROSTER} atletas. Libere uma vaga antes de recrutar.`);
  if (c.scholarship < r.cost) return result(c, false, `Bolsas insuficientes. Faltam ${money(r.cost - c.scholarship)}.`);
  c.scholarship -= r.cost;
  r.recruited = true;
  const { cost, recruited, hometown, ...athlete } = r;
  const player = { ...athlete, stats: { ...athlete.stats } };
  if (c.roster.some((p) => p.number === player.number)) player.number = numberFor(player.position, Math.random, new Set(c.roster.map((p) => p.number)));
  c.roster.push(player);
  c.lastNotice = `${player.name} chegou ao campus! ${player.position} · ${player.rating.toFixed(1)} estrelas.`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}
function releaseAthlete(c, id) {
  const i = c.roster.findIndex((p) => p.id === id);
  if (i < 0) return result(c, false, 'Atleta não encontrado.');
  const [p] = c.roster.splice(i, 1);
  c.yearbook.push({ ...p, leftSeason: c.season, reason: 'Dispensado' });
  c.lastNotice = `${p.name} deixou o elenco. Uma vaga está disponível.`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}
function setTraining(c, plan) {
  const texts = { light: 'Treino leve: mais recuperação e menos desgaste acadêmico.', normal: 'Treino equilibrado: desenvolvimento e recuperação moderados.', hard: 'Treino intenso: mais XP, com maior desgaste e queda de GPA.' };
  if (!texts[plan]) return result(c, false, 'Escolha um ritmo de treino válido.');
  c.training = plan;
  c.lastNotice = texts[plan];
  saveCareer(c);
  return result(c, true, texts[plan]);
}
function tutorAthlete(c, id) {
  const p = c.roster.find((x) => x.id === id);
  if (!p) return result(c, false, 'Atleta não encontrado.');
  if (p.gpa >= p.academicLimit - 0.01) return result(c, false, 'O atleta já está no seu melhor nível acadêmico.');
  if (c.cc < COSTS.tutor) return result(c, false, `A tutoria custa ${COSTS.tutor} CC.`);
  const old = p.gpa;
  c.cc -= COSTS.tutor;
  p.gpa = roundTo(Math.min(p.academicLimit, p.gpa + 0.65), 2);
  p.morale = Math.min(100, p.morale + 3);
  c.lastNotice = `${p.name}: GPA ${old.toFixed(1)} → ${p.gpa.toFixed(1)}.${old < 2 && p.gpa >= 2 ? ' Liberado academicamente!' : ''}`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}
const upgradeCost = (c, key) => (key === 'scholarship' ? COSTS.scholarshipExpansion : 10 + num(c.facilities[key], 1) * 8);
function upgradeFacility(c, key) {
  if (key === 'scholarship') {
    if (c.scholarshipCap >= 200000) return result(c, false, 'O fundo já atingiu o limite de $200.000.');
    if (c.cc < COSTS.scholarshipExpansion) return result(c, false, `Expandir o fundo custa ${COSTS.scholarshipExpansion} CC.`);
    c.cc -= COSTS.scholarshipExpansion;
    c.scholarshipCap += 20000;
    saveCareer(c);
    return result(c, true, `Teto de bolsas ampliado para ${money(c.scholarshipCap)}. O saldo permanece igual.`);
  }
  if (!(key in FACILITIES)) return result(c, false, 'Instalação não encontrada.');
  if (c.facilities[key] >= 5) return result(c, false, `${FACILITIES[key]} já está no nível máximo.`);
  const cost = upgradeCost(c, key);
  if (c.cc < cost) return result(c, false, `Essa melhoria custa ${cost} CC.`);
  c.cc -= cost;
  c.facilities[key]++;
  c.lastNotice = `${FACILITIES[key]} melhorado para o nível ${c.facilities[key]}.`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}
function toggleBench(c, id) {
  const p = c.roster.find((x) => x.id === id);
  if (!p) return result(c, false, 'Atleta não encontrado.');
  p.benched = !p.benched;
  const text = p.benched ? 'no banco: vai recuperar condição e GPA' : p.gpa < 2 ? 'selecionado, mas ainda suspenso por GPA baixo' : p.injury > 0 ? 'selecionado, mas ainda lesionado' : 'de volta ao time';
  saveCareer(c);
  return result(c, true, `${p.name} ${text}.`);
}
function resolveEvent(c, choice) {
  const ev = c.event;
  if (!ev) return result(c, false, 'Não há evento pendente.');
  const n = Number(choice);
  if (!Number.isInteger(n) || n < 0 || n >= ev.choices.length) return result(c, false, 'Escolha uma opção válida.');
  const target = c.roster.find((p) => p.id === ev.targetId);
  if (ev.kind === 'study' && !target) { c.event = null; saveCareer(c); return result(c, false, 'O atleta envolvido deixou o elenco. O evento foi encerrado.'); }
  if (ev.kind === 'study') {
    target.gpa = roundTo(Math.min(target.academicLimit, target.gpa + (n === 0 ? 0.6 : 0.2)), 2);
    if (n === 0) target.condition = Math.min(100, target.condition + 8); else target.xp += 12;
  } else if (ev.kind === 'community') {
    if (n === 0) { c.cc += 3; c.roster.forEach((p) => { p.morale = Math.min(100, p.morale + 10); }); } else c.roster.forEach((p) => { p.condition = Math.min(100, p.condition + 12); });
  } else if (ev.kind === 'sponsor') {
    if (n === 0) c.scholarship = Math.min(c.scholarshipCap, c.scholarship + 8000); else c.cc += 8;
  }
  c.lastNotice = `${ev.choices[n].label}: ${ev.choices[n].effectText}.`;
  c.event = null;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}

/** Zera o calendário e abre a temporada seguinte (compartilhado entre virada de ano e troca de emprego). */
function beginNextSeason(c) {
  c.season++;
  c.week = 0;
  c.phase = 'regular';
  c.record = { wins: 0, losses: 0 };
  c.schedule = makeSchedule(c.season, c.seed);
  c.processedMatches = [];
  c.playoffSeeds = [];
  c.championId = null;
  c.lastResult = null;
  c.event = null;
  c.recruits = makeRecruits(c);
  c.seasonStats = emptySeasonStats();
  c.seasonSummary = null;
}

function startNextSeason(c) {
  if (c.phase !== 'offseason') return result(c, false, 'Conclua a temporada antes de começar a próxima.');
  if (c.fired) return result(c, false, 'Escolha uma nova universidade antes de continuar.');
  const graduates = c.roster.filter((p) => p.year >= 4);
  const draftBonus = graduates.reduce((sum, p) => sum + (p.rating >= 3 ? Math.round(p.rating * 2400 / 500) * 500 : 1500), 0);
  c.yearbook.push(...graduates.map((p) => ({ ...p, leftSeason: c.season, reason: p.rating >= 3 ? 'Draft profissional' : 'Formado' })));
  c.roster = c.roster.filter((p) => p.year < 4).map((p) => ({ ...p, year: p.year + 1, gpa: roundTo(Math.min(p.academicLimit, p.gpa + 0.5), 2), condition: 100, injury: 0, morale: Math.min(100, p.morale + 5), stats: { games: 0, yards: 0, touchdowns: 0, tackles: 0 } }));
  c.scholarship = Math.min(c.scholarshipCap, c.scholarship + 20000 + draftBonus);
  c.cc += 8;
  beginNextSeason(c);
  const rng = careerRng(c, 'walkons');
  const walkOns = [];
  while (c.roster.length < 6) {
    const pos = ROSTER_TEMPLATE.find((p) => !c.roster.some((x) => x.position === p)) || pick(ROSTER_TEMPLATE, rng);
    const a = makeAthlete(rng, `${c.season}-walkon-${c.roster.length}`, pos, 1.4 + rng() * 0.6);
    a.walkon = true;
    c.roster.push(a);
    walkOns.push(a.name);
  }
  fixRosterNumbers(c.roster, rng);
  c.goals = generateSeasonGoals(c);
  c.lastNotice = `Temporada ${c.season}! ${graduates.length} ${plural(graduates.length, 'atleta formado', 'atletas formados')}, +${money(20000 + draftBonus)} em bolsas e +8 CC.${walkOns.length ? ` ${walkOns.length} walk-on(s) completaram o elenco.` : ''}`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}

/** Propostas após uma demissão: programas um degrau abaixo do atual, de qualquer conferência. */
function makeJobOffers(c) {
  const rng = careerRng(c, 'offers');
  const target = clamp(getTeam(c.teamId).power - 0.8, 1.2, 3.4);
  const pool = allTeams().filter((t) => t.id !== c.teamId && t.power <= Math.max(1.8, getTeam(c.teamId).power - 0.3))
    .sort((a, b) => Math.abs(a.power - target) - Math.abs(b.power - target)).slice(0, 9);
  return shuffled(pool, rng).slice(0, 3).map((t) => t.id);
}

function acceptJobOffer(c, teamId) {
  if (!c.fired || !c.jobOffers?.includes(teamId)) return result(c, false, 'Essa proposta não está mais disponível.');
  c.firedHistory.push({ season: c.season, teamId: c.teamId });
  const team = getTeam(teamId);
  c.teamId = teamId;
  const rng = careerRng(c, `new-program:${teamId}`);
  c.roster = programRoster(rng, teamId, `${teamId}-${c.season + 1}`);
  fixRosterNumbers(c.roster, rng);
  c.facilities = { stadium: 1, training: 1, rehab: 1 };
  c.training = 'normal';
  c.scholarship = Math.min(c.scholarshipCap, Math.max(c.scholarship, 50000));
  c.confidence = 50;
  c.fired = false;
  c.jobOffers = [];
  beginNextSeason(c);
  c.goals = generateSeasonGoals(c);
  c.lastNotice = `Bem-vindo a ${team.name}! A diretoria confia em você para reconstruir o programa.`;
  saveCareer(c);
  return result(c, true, c.lastNotice);
}

/* =====================================================================
   GOALS (3 metas de estatística por temporada + confiança da diretoria)
   ===================================================================== */
const GOAL_REWARDS = [null, { cc: 4, funds: 4000 }, { cc: 7, funds: 7000 }, { cc: 10, funds: 10000 }];
const GOAL_TYPES = Object.freeze({
  passingYards: { cat: 'offense', kind: 'gte', metric: 'passingYards', perGame: 138, step: 50, label: (t) => `Lançar ${fmtInt(t)} jardas de passe` },
  passingTDs: { cat: 'offense', kind: 'gte', metric: 'passingTDs', perGame: 1.32, step: 1, label: (t) => `Lançar ${t} passes para touchdown` },
  rushingYards: { cat: 'offense', kind: 'gte', metric: 'rushingYards', perGame: 68, step: 25, label: (t) => `Correr ${fmtInt(t)} jardas` },
  touchdowns: { cat: 'offense', kind: 'gte', metric: 'touchdowns', perGame: 2.05, step: 1, label: (t) => `Marcar ${t} touchdowns` },
  firstDowns: { cat: 'offense', kind: 'gte', metric: 'firstDowns', perGame: 9.8, step: 5, label: (t) => `Conquistar ${t} first downs` },
  completionPct: { cat: 'efficiency', kind: 'pct', minAttempts: 30, label: (t) => `Acertar ${t}% dos passes (mín. 30 tentativas)` },
  turnovers: { cat: 'efficiency', kind: 'lte', metric: 'turnovers', label: (t) => `No máximo ${t} turnovers na temporada` },
  pointsAllowed: { cat: 'efficiency', kind: 'lteAvg', label: (t) => `Sofrer até ${t} pontos por jogo` },
  longestPlay: { cat: 'efficiency', kind: 'gte', metric: 'longestPlay', label: (t) => `Fazer uma jogada de ${t}+ jardas` },
  bigGame: { cat: 'efficiency', kind: 'gte', metric: 'maxPointsGame', label: (t) => `Marcar ${t}+ pontos em uma partida` },
  regularWins: { cat: 'campaign', kind: 'wins', label: (t) => `Vencer ${t} jogos na temporada regular` },
  blowout: { cat: 'campaign', kind: 'gte', metric: 'biggestWin', label: (t) => `Vencer uma partida por ${t}+ pontos` },
  top25: { cat: 'campaign', kind: 'top25', label: () => 'Terminar a temporada no Top 25' },
  confTitle: { cat: 'campaign', kind: 'confTitle', label: () => 'Conquistar o título da conferência' },
  playoffs: { cat: 'campaign', kind: 'playoffs', label: () => 'Classificar para o playoff nacional' },
  final: { cat: 'campaign', kind: 'final', label: () => 'Chegar à final nacional' },
  title: { cat: 'campaign', kind: 'title', label: () => 'Conquistar o título nacional' },
});
const GOAL_CATEGORY_NAMES = { offense: 'PRODUÇÃO', efficiency: 'EFICIÊNCIA', campaign: 'CAMPANHA' };
const goalLabel = (g) => GOAL_TYPES[g.type]?.label(g.target) || 'Meta';

// Fator de volume por duração do quarto, medido em partidas simuladas (não é linear).
const QUARTER_VOLUME = { 60: 1, 120: 1.9, 180: 2.6 };

// Chance de vitória por jogo, medida no motor: ~60% com forças iguais e +17 pontos por ponto de vantagem.
const winChance = (mine, opp, diff = 1) => clamp(0.6 + (mine - opp) * 0.17 + (diff - 1) * 1.5, 0.06, 0.94);
// Força média com que as metas foram calibradas (adversários da liga antiga).
const GOAL_BASE_OPP = 3.5;

function generateSeasonGoals(c) {
  const rng = careerRng(c, `goals:${c.teamId}`);
  const st = teamStrength(c);
  const qf = QUARTER_VOLUME[num(c.settings?.quarterSeconds, 60)] || 1;
  const diff = { easy: 1.05, normal: 1, hard: 0.93 }[c.settings?.difficulty] || 1;
  const avg = (st.offense + st.defense) / 2;
  const myGames = c.schedule.filter((g) => g.stage === 'regular' && isMine(c, g));
  const oppPowers = myGames.map((g) => getTeam(g.homeId === c.teamId ? g.awayId : g.homeId).power);
  const oppAvg = oppPowers.length ? oppPowers.reduce((a, b) => a + b, 0) / oppPowers.length : GOAL_BASE_OPP;
  // Calendário mais fraco rende mais jardas e pontos; mais forte, menos.
  const oppF = clamp(1 - (oppAvg - GOAL_BASE_OPP) * 0.1, 0.8, 1.25);
  const offF = (1 + (st.offense - 3) * 0.06) * diff * oppF;
  const tierRoll = () => { const r = rng(); return r < 0.4 ? 1 : r < 0.82 ? 2 : 3; };
  const tierMul = [0, 0.92, 1.04, 1.16];
  const nice = (v, step) => Math.max(step, Math.round(v / step) * step);
  const make = (type, tier, target) => ({ id: `${c.season}-${type}`, type, tier, target, status: 'active', rewardCC: GOAL_REWARDS[tier].cc, rewardFunds: GOAL_REWARDS[tier].funds });

  const offType = pick(['passingYards', 'passingTDs', 'rushingYards', 'touchdowns', 'firstDowns'], rng);
  const offTier = tierRoll();
  const def = GOAL_TYPES[offType];
  const offense = make(offType, offTier, nice(def.perGame * REG_WEEKS * qf * offF * tierMul[offTier], def.step));

  const effType = pick(['completionPct', 'turnovers', 'pointsAllowed', 'longestPlay', 'bigGame'], rng);
  const effTier = tierRoll();
  const tIdx = effTier - 1;
  const effTarget = {
    completionPct: Math.round([69, 74, 78][tIdx] + (st.offense - 3) * 1.5),
    turnovers: Math.max(3, Math.round([9, 7, 5][tIdx] * qf)),
    pointsAllowed: Math.max(7, Math.round([16, 13, 11][tIdx] * qf * (1 - (st.defense - 3) * 0.06) * (2 - diff) * (2 - oppF))),
    longestPlay: Math.round([32, 42, 52][tIdx] + (qf - 1) * 4),
    bigGame: Math.round([17, 23, 28][tIdx] * (1 + (qf - 1) * 0.85) * oppF),
  }[effType];
  const efficiency = make(effType, effTier, effTarget);

  // Campanha: os objetivos dependem de onde o programa está no país e na conferência.
  const conf = confOf(c.teamId);
  const confRank = conf === 'ind' ? 99 : 1 + teamIdsInConf(conf).filter((id) => id !== c.teamId && getTeam(id).power > avg).length;
  const campaignPool = ['regularWins', 'regularWins', 'blowout'];
  if (avg >= 2.6) campaignPool.push('top25');
  if (confRank <= 3) campaignPool.push('confTitle');
  if (avg >= 3.6) campaignPool.push('playoffs');
  if (avg >= 4.0) campaignPool.push('final');
  if (avg >= 4.3) campaignPool.push('title');
  const campType = pick(campaignPool, rng);
  let campaign;
  if (campType === 'top25') campaign = make('top25', avg >= 3.9 ? 1 : avg >= 3.2 ? 2 : 3, 1);
  else if (campType === 'confTitle') campaign = make('confTitle', confRank === 1 ? 2 : 3, 1);
  else if (campType === 'playoffs') campaign = make('playoffs', avg >= 4.2 ? 2 : 3, 1);
  else if (campType === 'final') campaign = make('final', 3, 1);
  else if (campType === 'title') campaign = make('title', 3, 1);
  else {
    const tier = tierRoll();
    if (campType === 'blowout') campaign = make('blowout', tier, Math.round([10, 14, 19][tier - 1] * (1 + (qf - 1) * 0.8) * clamp(1 + (avg - oppAvg) * 0.15, 0.8, 1.5)));
    else {
      // O elenco ganha XP ao longo da temporada, por isso a expectativa usa um pouco mais que a força atual.
      const expected = myGames.reduce((sum, g) => sum + winChance(avg + 0.15, getTeam(g.homeId === c.teamId ? g.awayId : g.homeId).power, diff), 0) || REG_WEEKS * 0.5;
      campaign = make('regularWins', tier, clamp(Math.round(expected + [-0.6, 0.4, 1.4][tier - 1]), 1, REG_WEEKS));
    }
  }
  return [offense, efficiency, campaign];
}

function goalValue(c, g) {
  const s = c.seasonStats || emptySeasonStats();
  const t = GOAL_TYPES[g.type];
  if (!t) return 0;
  if (t.metric) return num(s[t.metric]);
  if (t.kind === 'pct') return s.passAttempts ? (s.completions / s.passAttempts) * 100 : 0;
  if (t.kind === 'lteAvg') return s.games ? s.pointsAgainst / s.games : 0;
  if (t.kind === 'wins') return s.regularWins;
  return g.status === 'done' ? 1 : 0;
}

/** Fora da disputa do título: não entrou no playoff ou perdeu um jogo dele. */
function eliminated(c) {
  if (c.playoffSeeds.length && !c.playoffSeeds.includes(c.teamId)) return true;
  return c.schedule.some((g) => PLAYOFF_STAGES.has(g.stage) && g.played && isMine(c, g) && winnerOf(g) !== c.teamId);
}
function confTitleStatus(c) {
  const g = c.schedule.find((m) => m.stage === 'conf' && m.conf === confOf(c.teamId));
  if (!g) return c.week > REG_WEEKS || c.phase === 'offseason' ? 'failed' : 'active';
  if (!isMine(c, g)) return 'failed';
  return g.played ? (winnerOf(g) === c.teamId ? 'done' : 'failed') : 'active';
}

function evaluateGoal(c, g, seasonOver) {
  const t = GOAL_TYPES[g.type];
  const v = goalValue(c, g);
  switch (t?.kind) {
    case 'gte': return v >= g.target ? 'done' : seasonOver ? 'failed' : 'active';
    case 'pct': return !seasonOver ? 'active' : c.seasonStats.passAttempts >= t.minAttempts && v >= g.target ? 'done' : 'failed';
    case 'lte': return v > g.target ? 'failed' : seasonOver ? 'done' : 'active';
    case 'lteAvg': return !seasonOver ? 'active' : c.seasonStats.games > 0 && v <= g.target ? 'done' : 'failed';
    case 'wins': {
      if (v >= g.target) return 'done';
      const remaining = c.schedule.filter((m) => m.stage === 'regular' && !m.played && isMine(c, m)).length;
      return seasonOver || v + remaining < g.target ? 'failed' : 'active';
    }
    case 'playoffs': return c.playoffSeeds.includes(c.teamId) ? 'done' : seasonOver || c.playoffSeeds.length ? 'failed' : 'active';
    case 'confTitle': { const s = confTitleStatus(c); return s === 'active' && seasonOver ? 'failed' : s; }
    case 'top25': return !seasonOver ? 'active' : rankOf(c) <= 25 ? 'done' : 'failed';
    case 'final': {
      const fin = c.schedule.find((m) => m.stage === 'final');
      if (fin && isMine(c, fin)) return 'done';
      return seasonOver || eliminated(c) ? 'failed' : 'active';
    }
    case 'title': return c.championId === c.teamId ? 'done' : seasonOver || eliminated(c) ? 'failed' : 'active';
    default: return seasonOver ? 'failed' : 'active';
  }
}

/** Reavalia as metas ativas. Metas cumpridas pagam a recompensa na hora. */
function refreshGoals(c, { seasonOver = false } = {}) {
  const changes = [];
  for (const g of c.goals || []) {
    if (g.status !== 'active') continue;
    const status = evaluateGoal(c, g, seasonOver);
    if (status === 'active') continue;
    g.status = status;
    if (status === 'done') { c.cc += g.rewardCC; c.scholarship = Math.min(c.scholarshipCap, c.scholarship + g.rewardFunds); }
    changes.push({ id: g.id, status });
  }
  return changes;
}

const goalSnapshot = (c) => (c.goals || []).map((g) => ({ id: g.id, status: g.status, value: goalValue(c, g) }));
function goalView(c, g) {
  const t = GOAL_TYPES[g.type] || {};
  const v = goalValue(c, g);
  let ratio = 0, text = '';
  if (t.kind === 'gte' || t.kind === 'wins') { ratio = clamp(v / g.target, 0, 1); text = `${fmtInt(v)} / ${fmtInt(g.target)}`; }
  else if (t.kind === 'pct') { ratio = clamp(v / g.target, 0, 1); text = `${Math.round(v)}% / ${g.target}% · ${c.seasonStats.passAttempts} tent.`; }
  else if (t.kind === 'lte') { ratio = clamp(v / Math.max(1, g.target), 0, 1); text = `${fmtInt(v)} de no máx. ${g.target}`; }
  else if (t.kind === 'lteAvg') { ratio = c.seasonStats.games ? clamp(v / g.target, 0, 1) : 0; text = c.seasonStats.games ? `${v.toFixed(1).replace('.', ',')} / ${g.target} por jogo` : `até ${g.target} por jogo`; }
  else if (t.kind === 'top25' && g.status === 'active') { const r = rankOf(c); ratio = clamp((TEAM_COUNT - r) / (TEAM_COUNT - 25), 0, 1); text = `Ranking atual: #${r}`; }
  else { ratio = g.status === 'done' ? 1 : 0; text = g.status === 'done' ? 'Conquistada' : g.status === 'failed' ? 'Não alcançada' : 'Em disputa'; }
  if (g.status === 'done') ratio = 1;
  return { id: g.id, type: g.type, cat: t.cat, kind: t.kind, tier: g.tier, label: goalLabel(g), status: g.status, ratio, text, value: v, target: g.target, reward: `+${g.rewardCC} CC · +${money(g.rewardFunds)}` };
}
function goalDiffs(c, before) {
  return c.goals.map((g) => {
    const b = before.find((x) => x.id === g.id);
    const view = goalView(c, g);
    return { ...view, before: b?.value ?? 0, delta: view.value - (b?.value ?? 0), changed: !!b && b.status !== g.status };
  });
}

function evaluateSeason(c, rank, champion) {
  const before = c.confidence;
  refreshGoals(c, { seasonOver: true });
  const done = c.goals.filter((g) => g.status === 'done').length;
  const failed = c.goals.filter((g) => g.status === 'failed').length;
  const lines = [];
  if (done) lines.push({ label: `${done} ${plural(done, 'meta cumprida', 'metas cumpridas')}`, value: done * 12 });
  if (failed) lines.push({ label: `${failed} ${plural(failed, 'meta não alcançada', 'metas não alcançadas')}`, value: -failed * 15 });
  if (champion) lines.push({ label: 'Título nacional', value: 15 });
  else if (c.playoffSeeds.includes(c.teamId)) lines.push({ label: 'Classificação para o playoff nacional', value: 6 });
  if (confTitleStatus(c) === 'done') lines.push({ label: `Título da ${CONF_BY_ID.get(confOf(c.teamId)).name}`, value: 4 });
  if (c.record.wins < c.record.losses) lines.push({ label: 'Campanha negativa', value: -8 });
  const delta = lines.reduce((sum, l) => sum + l.value, 0);
  c.confidence = clamp(before + delta, 0, 100);
  c.fired = c.confidence <= 0;
  c.jobOffers = c.fired ? makeJobOffers(c) : [];
  c.seasonSummary = {
    season: c.season, teamId: c.teamId, wins: c.record.wins, losses: c.record.losses, rank, champion, championId: c.championId,
    goals: c.goals.map((g) => goalView(c, g)), lines, before, after: c.confidence, fired: c.fired, seen: false,
  };
}

/* =====================================================================
   SAVE: carregar, validar, migrar, salvar
   ===================================================================== */
function saveCareer(c) {
  if (!c) return false;
  const ok = store.set(KEYS.career, JSON.stringify(c));
  if (!ok && !saveCareer.warned) { saveCareer.warned = true; setTimeout(() => toast('Armazenamento local indisponível: o progresso não será salvo.', true), 0); }
  return ok;
}

/**
 * Saves v1/v2 vêm da liga fictícia de 12 times. Cada universidade vira a equivalente real (LEGACY_TEAM_MAP),
 * elenco, dinheiro, estrutura e legado são mantidos, e a temporada recomeça no calendário nacional.
 */
function migrateLegacy(n) {
  const mapId = (id) => LEGACY_TEAM_MAP[id] || (TEAM_BY_ID.has(id) ? id : null);
  n.teamId = mapId(n.teamId);
  for (const h of n.history) { h.teamId = mapId(h.teamId) || n.teamId; h.championId = mapId(h.championId) || h.teamId; h.conf = confOf(h.teamId); }
  n.firedHistory = (Array.isArray(n.firedHistory) ? n.firedHistory : []).map((f) => ({ ...f, teamId: mapId(f?.teamId) })).filter((f) => f.teamId);
  if (n.phase === 'offseason') n.season++;
  n.schemaVersion = 3;
  n.week = 0;
  n.phase = 'regular';
  n.record = { wins: 0, losses: 0 };
  n.schedule = makeSchedule(n.season, n.seed);
  n.processedMatches = [];
  n.playoffSeeds = [];
  n.championId = null;
  n.lastResult = null;
  n.event = null;
  n.seasonStats = emptySeasonStats();
  n.seasonSummary = null;
  n.fired = false;
  n.jobOffers = [];
  n.confidence = typeof n.confidence === 'number' && n.confidence > 0 ? clamp(n.confidence, 0, 100) : 50;
  n.recruits = makeRecruits(n);
  n.goals = generateSeasonGoals(n);
  n.lastNotice = `Carreira transferida para a liga universitária completa: ${getTeam(n.teamId).name} começa a temporada ${n.season}.`;
  return n;
}

const SAVE_STAGES = new Set(['regular', 'bowl', ...POST_STAGES]);
function validateCareer(input) {
  const fail = (why) => ({ ok: false, career: null, message: `Save inválido: ${why}` });
  try {
    const text = typeof input === 'string' ? input : JSON.stringify(input);
    if (!text) return fail('arquivo vazio.');
    if (text.length > 2 * 1024 * 1024) return fail('o arquivo deve ter até 2 MB.');
    const n = JSON.parse(text, (k, v) => (['__proto__', 'constructor', 'prototype'].includes(k) ? undefined : v));
    if (!n || typeof n !== 'object' || Array.isArray(n) || ![1, 2, 3].includes(n.schemaVersion)) return fail('versão de formato incompatível.');
    const legacy = n.schemaVersion < 3;
    const teamOk = (id) => isKnownTeam(id) || (legacy && Object.hasOwn(LEGACY_TEAM_MAP, id));
    if (!teamOk(n.teamId)) return fail('universidade desconhecida.');
    const inRange = (v, lo, hi, int = false) => typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi && (!int || Number.isInteger(v));
    if (!inRange(n.season, 1900, 9999, true) || !inRange(n.week, 0, LAST_WEEK, true) || !inRange(n.seed, 0, 4294967295, true)) return fail('ano, semana ou identificador da carreira incorreto.');
    if (!inRange(n.cc, 0, 1e8, true) || !inRange(n.scholarshipCap, 1e4, 1e8, true) || !inRange(n.scholarship, 0, n.scholarshipCap, true)) return fail('saldos ou limite de bolsas incorretos.');
    if (!Array.isArray(n.roster) || n.roster.length > MAX_ROSTER || !Array.isArray(n.schedule)) return fail('elenco ou calendário incompleto.');
    if (new Set(n.roster.map((p) => p?.id)).size !== n.roster.length) return fail('há atletas duplicados.');
    for (const p of [...n.roster, ...(Array.isArray(n.recruits) ? n.recruits : [])]) {
      if (!p || typeof p.id !== 'string' || !p.id || typeof p.name !== 'string' || !p.name || p.name.length > 100 || !Object.hasOwn(POSITIONS, p.position)) return fail('identificação de atleta incorreta.');
      if (!inRange(p.year, 1, 4, true) || !inRange(p.rating, 1, 5) || !inRange(p.potential, p.rating, 5) || !inRange(p.gpa, 0, 4) || !inRange(p.condition, 0, 100) || !inRange(p.morale, 0, 100) || !inRange(p.xp, 0, 1e4)) return fail('atributos ou situação de atleta incorretos.');
      if (['speed', 'strength', 'skill', 'stamina'].some((k) => !inRange(p[k], 0, 10))) return fail('atributos de atleta fora da escala.');
      if (p.injury != null && !inRange(p.injury, 0, 100, true)) return fail('estado de lesão incorreto.');
    }
    if (!n.facilities || ['stadium', 'training', 'rehab'].some((k) => !inRange(n.facilities[k], 1, 5, true))) return fail('níveis das instalações incorretos.');
    if ((n.history != null && !Array.isArray(n.history)) || (n.yearbook != null && !Array.isArray(n.yearbook)) || (n.recruits != null && !Array.isArray(n.recruits))) return fail('histórico ou recrutamento inválido.');
    if (n.history?.some((h) => !h || !inRange(h.season, 1900, 9999, true) || !teamOk(h.teamId) || !teamOk(h.championId) || !inRange(h.wins, 0, 20, true) || !inRange(h.losses, 0, 20, true))) return fail('registro de temporada inválido.');
    if (n.yearbook?.some((p) => !p || typeof p.name !== 'string' || !Object.hasOwn(POSITIONS, p.position) || !inRange(p.rating, 1, 5))) return fail('registro de atleta inválido no Yearbook.');
    if (n.recruits?.some((p) => !inRange(p.cost, 0, 1e8, true))) return fail('candidato de recrutamento inválido.');
    // Campos comuns
    n.coachName = String(n.coachName || 'Coach Aguiar').slice(0, 32);
    n.history ||= [];
    n.yearbook ||= [];
    n.training = ['light', 'normal', 'hard'].includes(n.training) ? n.training : 'normal';
    const st = n.settings || {};
    n.settings = { difficulty: DIFFICULTIES[st.difficulty] ? st.difficulty : 'normal', quarterSeconds: QUARTER_OPTIONS.includes(Number(st.quarterSeconds)) ? Number(st.quarterSeconds) : 60 };
    for (const p of [...n.roster, ...(n.recruits || [])]) {
      p.injury = Math.max(0, Math.floor(num(p.injury)));
      p.benched = !!p.benched;
      p.academicLimit = clamp(num(p.academicLimit, 4), p.gpa, 4);
      p.stats = Object.fromEntries(['games', 'yards', 'touchdowns', 'tackles'].map((k) => [k, Math.max(0, Math.round(num(p.stats?.[k])))]));
    }
    fixRosterNumbers(n.roster, makeRng(n.seed));
    if (legacy) {
      migrateLegacy(n);
      return { ok: true, career: n, message: `Carreira de ${n.coachName} convertida para a liga universitária completa.` };
    }
    // Save v3: calendário nacional

      emit('score', 'TOUCHDOWN!', `${s.home.short} marca seis pontos!`, { points: 6, team: 'home' });
      s.effects.push({ x: 111, y: carrier?.y || 26, color: s.home.primary, age: 0, kind: 'touchdown' });
      endPlay('TOUCHDOWN!', 'Uma campanha de respeito. Escolha a conversão.', 'conversion');
      return;
    }
    if (x <= 10 && outcome !== 'incomplete') {
      s.awayScore += 2; s.stats.turnovers++;
      emit('score', 'SAFETY', 'Dois pontos para o adversário.', { points: 2, team: 'away' });
      endPlay('SAFETY', 'O quarterback foi parado na própria end zone.', watching() && !s.overtime ? 'safetyKick' : 'defense');
      return;
    }
    const gained = Math.round(x - startLos);
    s.los = outcome === 'incomplete' ? startLos : clamp(x, 10.2, 109.8);
    if (outcome === 'incomplete') sound('incomplete');
    if (outcome !== 'incomplete' && s.los + 0.05 >= s.firstDownX) {
      const fourth = s.down === 4;
      s.down = 1;
      s.firstDownX = Math.min(110, s.los + 10);
      s.yardsToGo = Math.max(1, Math.ceil(s.firstDownX - s.los));
      s.stats.firstDowns++;
      emit('firstDown', 'FIRST DOWN!', `Avanço de ${gained} jardas.`, { yards: gained, fourth, caught: Boolean(play?.completed), player: carrier });
      endPlay('FIRST DOWN!', `+${gained} jardas · nova série de tentativas.`, 'ready');
    } else {
      s.down++;
      s.yardsToGo = Math.max(1, Math.ceil(s.firstDownX - s.los));
      if (s.down > 4) {

        endPlay('TROCA DE POSSE', 'Quarta tentativa não convertida.', 'defense');
      } else {
        const title = outcome === 'incomplete' ? 'PASSE INCOMPLETO' : outcome === 'sack' ? 'SACK!' : outcome === 'out' ? 'FORA DE CAMPO' : outcome === 'dive' ? 'MERGULHO!' : 'FIM DA JOGADA';
        const text = outcome === 'incomplete' ? `${ordinal(s.down)} tentativa · ${s.yardsToGo} jardas.` : `${gained >= 0 ? '+' : ''}${gained} jardas · ${ordinal(s.down)} para ${s.yardsToGo}.`;

  }

  /* ----------------------------- QTE ----------------------------- */
  function startQte(q) {
    s.qte = { t: 0, result: null, resultT: 0, ...q };
    emit('qteStart', q.prompt, q.sub || '', { kind: q.kind });
  }
  function startSequenceQte(length, q) {
    const adjustment = ({ easy: -1, hard: 1 })[opts.difficulty] || 0;
    const graded = q.minAccuracy !== undefined;
    const long = graded || q.kind === 'conversion';
    const min = long ? 7 : 3, max = long ? 10 : 5;
    const center = clamp(length + adjustment, min, max);
    const lower = Math.max(min, center - 1), upper = Math.min(max, center + 1);
    const count = lower + Math.floor(rng() * (upper - lower + 1));
    const arrow = pick(QTE_ARROWS, rng), letter = pick(QTE_LETTERS, rng);
    const keys = Object.keys(QTE_KEYS);
    const otherKeys = keys.filter((key) => key !== arrow && key !== letter);
    const sequence = shuffled([arrow, letter, ...shuffled(otherKeys, rng).slice(0, count - 2)], rng);
    while (sequence.length < count) sequence.push(pick(keys.filter((key) => key !== sequence.at(-1)), rng));

  }
  function finishQte(success, feedback = '') {
    const q = s.qte;
    if (!q || q.result) return;
    const graded = q.minAccuracy !== undefined;
    const partial = !success && q.onPartial && graded && q.correct >= Math.ceil(q.sequence.length * q.minAccuracy);
    q.result = success ? 'success' : partial ? 'partial' : 'fail';
    q.resultT = 0;
    q.feedback = graded ? `${q.correct}/${q.sequence.length} · ${Math.round(q.correct / q.sequence.length * 100)}%` : feedback;
    if (success) s.stats.qteWins++;
    emit('qteEnd', success ? q.successText : partial ? q.partialText : q.failText, '', { kind: q.kind, success, partial: Boolean(partial) });

  }
  function qteInput(action) {
    const q = s.qte;
    if (!q || q.result || s.paused) return false;
    if (q.type === 'timing') {
      if (action !== 'tap') return false;
      const progress = q.t / q.duration;
      const correct = progress >= q.window[0] && progress <= q.window[1];
      q.lastInput = { key: action, t: q.t };
      if (correct) emit('qteHit');
      finishQte(correct);
    } else {
      if (!Object.hasOwn(QTE_KEYS, action)) return false;
      const correct = action === q.sequence[q.step];
      q.lastInput = { key: action, index: q.step, t: q.t };
      q.answers[q.step] = correct;
      if (correct) emit('qteHit');
      if (!correct && q.minAccuracy === undefined) finishQte(false, 'TECLA ERRADA');
      else {
        if (correct) q.correct++;
        q.step++;

  }
  function updateQte(dt) {
    const q = s.qte;

    if (q.t >= q.duration) finishQte(false, 'TEMPO ESGOTADO');
  }
  const qteTime = (base) => base * ({ easy: 1.25, normal: 1, hard: 0.82 })[opts.difficulty] || base;
  function timingWindow(separation) {
    const [center, base] = ({
      screen: [0.32, 0.13], slants: [0.46, 0.10], outs: [0.54, 0.11],
      pass: [0.60, 0.11], curl: [0.67, 0.12], deep: [0.76, 0.08],
    })[s.playId] || [0.58, 0.11];
    const rating = clamp(Number(opts.qbRating ?? s.home.power) || 3, 1, 5) - 3;
    const difficulty = ({ easy: 0.026, normal: 0, hard: -0.024 })[opts.difficulty] || 0;
    const space = separation === undefined ? 0.5 : clamp((separation - 1) / 6, 0, 1);
    const coverage = 0.60 + 0.8 * space;
    const normalWidth = clamp((base + difficulty + rating * 0.013) * coverage * WEATHER[s.weather].grip, 0.04, separation === undefined ? 0.161 : 0.19);
    const width = isConversion ? clamp(normalWidth * 0.43, 0.022, 0.069) : normalWidth;
    const variation = (rng() - 0.5) * (separation === undefined ? 0.054 : 0.13);
    const middle = clamp(center + variation + (space - 0.5) * 0.18 - rating * 0.015 - (flight?.power === 'bullet' ? 0.045 : 0), 0.11 + width / 2, 0.96 - width / 2);
    return [middle - width / 2, middle + width / 2];
  }

  function maybeJuke(carrier) {
    if (!qteEnabled() || s.qte || play.qteRolls >= 2 || play.elapsed < play.nextQteAt) return false;
    const d = awayPlayers().find((a) => a.fallenUntil <= play.elapsed && a.blockedUntil <= play.elapsed && play.elapsed >= a.reaction && dist(a, carrier) < 2.7 && ((carrier.x - a.x) * (a.vx - carrier.vx) + (carrier.y - a.y) * (a.vy - carrier.vy)) > 0);
    if (!d) return false;
    play.qteRolls++;
    play.nextQteAt = play.elapsed + 0.9;
    const chance = (play.qteRolls === 1 ? 0.62 : 0.38) * ({ easy: 1.15, normal: 1, hard: 0.85 }[opts.difficulty] || 1);
    if (rng() > chance) return false;
    const stiff = rng() < 0.32;
    const dir = stiff ? 'right' : d.y < carrier.y ? 'down' : 'up';
    startSequenceQte(stiff ? 4 : 3, {
      kind: 'juke',
      prompt: stiff ? 'STIFF ARM!' : 'JUKE!',
      successText: stiff ? 'STIFF ARM!' : 'QUE DRIBLE!', failText: 'NÃO DEU...',
      onSuccess() {
        d.fallenUntil = play.elapsed + 1.5; d.blockedUntil = play.elapsed + 1.5; d.anim = 'down';
        d.vx = (d.x - carrier.x) * 2; d.vy = (d.y - carrier.y) * 2;
        protectTime = 0.6; play.burst = 0.7;
        carrier.dodgeAnim = stiff ? 'stiff' : 'juke'; carrier.dodgeUntil = play.elapsed + 0.38;
        if (!stiff) carrier.vy += (dir === 'up' ? -1 : 1) * carrier.speed * 0.9;

    });

  }
  function maybeEscape(qb) {
    if (!qteEnabled() || s.qte || play.escapeRolled) return false;

    if (!d) return false;
    play.escapeRolled = true;
    if (rng() > 0.7) return false;
    startSequenceQte(4, {
      kind: 'escape', prompt: 'ESCAPE DO SACK!', successText: 'ESCAPOU!', failText: 'SACK!',
      onSuccess() { d.fallenUntil = play.elapsed + 1.3; d.blockedUntil = play.elapsed + 1.3; d.anim = 'down'; protectTime = 0.5; sound('juke'); },
      onFail() { protectTime = 0; },
    });
    return true;
  }

  function checkCarrier() {
    const carrier = byId(s.carrierId);
    if (!carrier || s.phase !== 'live' || qteActive()) return;
    if (carrier.x >= 110) { resolvePlay('touchdown', 110); return; }
    if (carrier.y < 0.1 || carrier.y > 53.2) { carrier.y = clamp(carrier.y, 0, FIELD_W); resolvePlay('out', carrier.x); return; }
    if (play.elapsed > 23) { resolvePlay('tackle', carrier.x); return; }
    if (diveTime > 0 || protectTime > 0) return;
    const inPocket = carrier.id === 'qb' && play.kind === 'pass' && !play.thrown;
    if (inPocket ? maybeEscape(carrier) : maybeJuke(carrier)) return;
    for (const d of awayPlayers()) {
      if (d.fallenUntil > play.elapsed || d.blockedUntil > play.elapsed || play.elapsed < d.reaction || dist(d, carrier) >= (watching() ? 1.36 : 1.02)) continue;
      if (carrier.role !== 'QB' && !play.brokenTackle && offenseRating() >= 3 && rng() < 0.08 + offenseRating() * 0.012) {
        play.brokenTackle = true;
        d.blockedUntil = play.elapsed + 1.2; d.fallenUntil = play.elapsed + 1; d.anim = 'down';
        carrier.dodgeAnim = 'stiff'; carrier.dodgeUntil = play.elapsed + 0.38;
        protectTime = 0.4;
        sound('break');
        say('QUEBROU O TACKLE!', 'Continue avançando!');
        emit('bigPlay', 'QUEBROU O TACKLE!', '');
        return;
      }
      d.anim = 'dive';
      d.vx = carrier.vx * 0.6; d.vy = carrier.vy * 0.6;
      const fumble = !inPocket && rng() < (opts.difficulty === 'hard' ? 0.012 : 0.006);
      sound('tackle');
      resolvePlay(inPocket ? 'sack' : fumble ? 'fumble' : 'tackle', carrier.x);
      return;
    }
  }

  // A linha defensiva nunca disputa o passe; no lob (bola alta) os linebackers também não alcançam.
  const canDefendPass = (p) => p.role !== 'DL' && !(flight?.power === 'lob' && p.role === 'LB');
  function updateFlight(dt) {
    if (!flight) return;
    flight.elapsed += dt;
    const k = clamp(flight.elapsed / flight.duration, 0, 1);
    s.ball.x = flight.from.x + (flight.to.x - flight.from.x) * k;
    s.ball.y = flight.from.y + (flight.to.y - flight.from.y) * k;
    const baseHeight = (flight.from.height || 1) * (1 - k) + (flight.to.height || 0) * k;
    s.ball.height = Math.max(0.15, baseHeight + Math.sin(k * Math.PI) * flight.arc);
    if (flight.kind === 'pass' && !flight.qteDone && qteEnabled() && !s.qte) {
      const remaining = flight.duration - flight.elapsed;
      if (remaining < 0.42 && remaining > 0.1) {
        flight.qteDone = true;
        const rec = byId(flight.receiverId) || homePlayers().filter((p) => PASS_TARGET_IDS.has(p.id)).sort((a, b) => dist(a, flight.to) - dist(b, flight.to))[0];
        if (rec && dist(rec, flight.to) < 7) {
          const f = flight;
          s.passingTargetId = rec.id;
          const nearby = awayPlayers().filter((p) => canDefendPass(p) && p.fallenUntil <= (play?.elapsed || 0))
            .map((p) => ({ p, gap: Math.min(dist(p, rec), dist(p, f.to)) })).sort((a, b) => a.gap - b.gap)[0];
          const separation = nearby?.gap ?? Infinity;
          const window = timingWindow(separation);
          const margin = (window[1] - window[0]) * 0.28;
          const perfectWindow = !isConversion && (f.power === 'lob' || separation < 3.4 || dist(rec, f.to) > 3.7)
            ? [window[0] + margin, window[1] - margin] : null;
          if (f.power === 'lob' || perfectWindow) { f.jumpPlayed = true; sound('jump'); }
          startQte({
            kind: 'catch', type: 'timing', duration: qteTime(1.15), window, perfectWindow,
            prompt: separation < 3.4 ? 'DISPUTA PELA BOLA!' : 'RECEBA O PASSE!', sub: 'TOQUE NA FAIXA VERDE',
            successText: 'QUE RECEPÇÃO!', failText: 'PASSE INCOMPLETO',
            onSuccess(q) {
              f.contested = 'won';
              const progress = q.t / q.duration;
              if (perfectWindow && progress >= perfectWindow[0] && progress <= perfectWindow[1]) {

                s.passTarget.catchStyle = 'catchOne';
              }
              if (separation < 3.4) { nearby.p.fallenUntil = (play?.elapsed || 0) + 1.2; nearby.p.anim = 'down'; }

      }

      flight = null;

    }
    if (flight.kind === 'kick' && flight.hitPost && !flight.rebound) {
      sound('post');
      flight.from = { ...flight.to };
      flight.to = { x: GOALPOST.x - 5, y: flight.to.y + (flight.to.y < FIELD_W / 2 ? -5 : 5), height: 0 };
      flight.elapsed = 0; flight.duration = 0.43; flight.arc = 1; flight.rebound = true;

    }

      const f = flight;

      if (f.kind === 'punt') {
        opponentStart = watching() ? (f.to.x >= 110 ? 90 : f.to.x) : clamp(s.los + 38 + rng() * 12, 40, 109);

          watching() ? 'A bola muda de posse.' : 'A defesa começa com o adversário longe da nossa end zone.', 'defense');

      } else {
        if (f.kickType !== 'pat') opponentStart = Math.min(90, s.los);

        endPlay(f.hitPost ? 'NA TRAVE!' : f.short ? 'CHUTE CURTO' : 'CHUTE PARA FORA',

    const receiver = homePlayers().filter((p) => ['WR', 'TE', 'RB'].includes(p.role)).sort((a, b) => dist(a, to) - dist(b, to))[0];
    const defender = awayPlayers().filter(canDefendPass).sort((a, b) => dist(a, to) - dist(b, to))[0];
    const rd = receiver ? dist(receiver, to) : Infinity, dd = defender ? dist(defender, to) : Infinity;

    const catchRange = ((opts.difficulty === 'easy' ? 5.5 : 4.6) + (flight.power === 'lob' ? 0.4 : 0)) * WEATHER[s.weather].grip;

    if (intercept) { giveBall(defender); defender.anim = 'intercept'; sound('jump'); sound('groan'); resolvePlay('interception', to.x); }
    else if (complete) {
      const oneHand = receiver.id === flight.oneHandId;
      const catchStyle = oneHand ? 'catchOne' : PASS_CATCH_STYLES[flight.power];
      if ((oneHand || catchStyle === 'catchHigh') && !flight.jumpPlayed) sound('jump');

      if (!isConversion) s.stats.completions++;

      receiver.vx = Math.max(receiver.vx, receiver.speed * 0.6);
      receiver.caughtUntil = play.elapsed + CATCH_RECOVERY_SECONDS;

      resolvePlay('incomplete', s.los);
    }
  }

  function finishGame() {
    setPhase('final');
    s.paused = false; s.simulating = false; s.choices = []; s.controlledId = null; s.qte = null;
    const won = s.homeScore > s.awayScore;
    freeze(won ? 'home' : watching() ? 'away' : null);
    const view = getState();
    s.result = { matchId: s.matchId, homeScore: view.homeScore, awayScore: view.awayScore, won: view.homeScore > view.awayScore,
      stats: { ...view.stats }, overtime: s.overtime, opponentId: view.away.id };
    if (watching()) s.result.watchStats = { home: { ...view.watchStats.home }, away: { ...view.watchStats.away } };
    say(watching() ? `${won ? s.home.short : s.away.short} VENCE!` : won ? 'VITÓRIA!' : 'FIM DE JOGO',
      `${view.home.short} ${view.homeScore} × ${view.awayScore} ${view.away.short}`);
    if (!finalSent) { finalSent = true; emit('final', s.title, s.message, { result: s.result }); }
  }
  function startOvertime() {
    s.overtime = true; s.overtimeRound++; s.quarter = 4 + s.overtimeRound; s.clock = 0; s.timeouts = 1;
    watchOtDrives = 0;
    setupOvertimeDrive();
    emit('period', `${s.overtimeRound}ª PRORROGAÇÃO`, s.message);
  }
  function setupOvertimeDrive() {
    isConversion = s.overtimeRound >= 3;
    s.los = isConversion ? 108 : 85; s.down = 1; s.firstDownX = isConversion ? 110 : 95;
    const msg = isConversion ? 'A partir da 3ª prorrogação: disputa de conversões de 2 pontos.'
      : watching() ? 'Cada equipe recebe uma posse na linha de 25.' : 'Cada equipe recebe uma posse. Seu ataque começa na linha de 25.';
    pendingMessage = msg;
    newPlay('pass');
  }
  function finishWatchOvertimeDrive() {
    watchOtDrives++;
    if (watchOtDrives === 1) { swapWatchOffense(); setupOvertimeDrive(); }
    else if (s.homeScore !== s.awayScore) finishGame();
    else startOvertime();
  }
  function checkClock() {
    if (s.overtime || s.clock > 0) return { ended: false, halftime: false };
    if (s.quarter < 4) {
      s.quarter++;
      s.clock = s.quarterSeconds;
      const half = s.quarter === 3;
      if (half) s.timeouts = 3;
      pendingMessage = half ? (watching() ? 'Intervalo encerrado.' : 'Intervalo encerrado. O adversário recebe a bola.') : `Começa o ${s.quarter}º quarto.`;
      emit('period', half ? 'SEGUNDO TEMPO' : `${s.quarter}º QUARTO`, pendingMessage, { endedQuarter: s.quarter - 1, halftime: half });
      return { ended: false, halftime: half };
    }
    if (s.homeScore === s.awayScore) { startOvertime(); return { ended: true, halftime: false }; }
    finishGame();
    return { ended: true, halftime: false };
  }
  function offerFourthDown() {
    setPhase('choice');
    const kick = Math.round(127 - s.los);
    s.choiceKind = 'fourth';
    s.choices = [{ id: 'go', label: `ARRISCAR · ${s.yardsToGo} JD` }];
    if (kick <= 66) s.choices.push({ id: 'fieldgoal', label: `FIELD GOAL · ${kick} JD` });
    s.choices.push({ id: 'punt', label: 'PUNT' });
    say('QUARTA TENTATIVA', 'Arriscar, pontuar ou afastar a bola?');
    sound('alert');
  }
  function offerConversion() {
    setPhase('choice');
    s.choiceKind = 'conversion';
    s.choices = s.overtime && s.overtimeRound >= 2 ? [{ id: 'two', label: 'CONVERSÃO DE 2 PONTOS' }] : [{ id: 'pat', label: 'CHUTE · +1 PONTO' }, { id: 'two', label: 'JOGADA · +2 PONTOS' }];
    say('ESCOLHA A CONVERSÃO', 'Um chute seguro ou uma jogada para dois pontos?');
  }
  function newDrive(spot) {
    isConversion = false;
    s.down = 1;
    s.los = spot === undefined ? clamp(35 + Math.round(rng() * 8 - 3) + driveBonus, 25, 60) : clamp(spot, 10.2, 109.8);
    driveBonus = 0;
    s.firstDownX = Math.min(110, s.los + 10);
    newPlay('pass');
  }

  /* -------------------- Defesa: chamada + jogada decisiva -------------------- */
  function startDefense() {
    if (watching()) {
      swapWatchOffense();
      newDrive(120 - opponentStart);
      return;
    }
    isConversion = false; s.conversion = false; s.possession = 'away';
    s.kickoff = null; s.kickType = null;
    s.controlledId = null; s.carrierId = null; s.ball.ownerId = null; s.ball.visible = false; s.choices = []; s.qte = null;
    freeze();
    if (s.simulating || opts.qte === false) { beginDefense(defenseCall('man')); return; }
    setPhase('defcall');
    say('DEFESA EM CAMPO', `${s.away.short} vai atacar. Escolha a sua defesa.`);
    emit('defenseCall', s.title, s.message);
  }
  function callDefense(id) {
    if (s.paused || s.phase !== 'defcall') return false;
    beginDefense(defenseCall(id));
    sound('select');
    return true;
  }
  function beginDefense(scheme) {
    const { id: call, pressure } = scheme;
    const opp = Number(s.away.power) || 3;

function playerPalette(team, skinIndex) {

    J: mix(P.helmet, P.helmetLight, 0.48), U: P.trim, A: P.mask, V: P.visor, R: P.visorLight, P: P.maskDark, M: P.mask, m: P.maskDark, F: P.skin, f: P.skinDark,

  for (let i = 0; i < digits.length; i++) {

    px(sx, sy, w, h, colors[part]);

      px(sx + 1, sy + h - 1, w - 1, 1, P.trim);

    if (part === 'h') {

function buildPlayerSheet(team, skinIndex, number, build = 0, preview = null) {
  const P = playerPalette(team, skinIndex);

  const g = sheet.getContext('2d', { willReadFrequently: true });
  for (let dir = 0; dir < (preview ? 1 : 2); dir++) {
    const left = preview ? preview.left : dir === 1;
    for (let f = 0; f < (preview ? 1 : FRAME_COUNT); f++) {
      const ox = f * SPRITE_W, oy = dir * SPRITE_H;
      const px = (x, y, w, h, color) => {
        if (w <= 0 || h <= 0) return;
        g.fillStyle = color;
        g.fillRect(ox + (left ? SPRITE_W - x - w : x), oy + y, w, h);
      };
      drawPlayerFrame(px, P, preview ? preview.frame : f, number, build, left);
      addOutline(g, ox, oy, SPRITE_W, SPRITE_H, P.outline);
    }

}

  function confetti(colors, touchdown = false) {
    if (reducedMotion.matches) return;
    const count = touchdown ? 148 : 78;
    for (let i = 0; i < count; i++) {
      const burst = touchdown && i < 88, side = i % 2 ? -1 : 1;
      const color = colors[i % colors.length];
      particles.push({
        world: false, x: burst ? (side === 1 ? R.W * 0.06 : R.W * 0.94) : Math.random() * R.W,
        y: burst ? R.H * (0.59 + Math.random() * 0.18) : -10 - Math.random() * 85,
        vx: burst ? side * (45 + Math.random() * 155) : (Math.random() - 0.5) * 38,

        width: i % 5 === 0 ? 5 : 2 + i % 2, height: i % 5 === 0 ? 2 : 3 + i % 3,

  function updateParticles(dt) {
    for (const p of particles) {

    const ease = (t) => 1 - (1 - clamp(t, 0, 1)) ** 3;
    const matchupTime = elapsed - MATCH_INTRO_REVEAL;
    const fade = still ? 1 : clamp((MATCH_INTRO_SECONDS - elapsed) / 0.43, 0, 1);

    ctx.save();
    ctx.globalAlpha = fade;
    if (broadcastBackdrop.complete && broadcastBackdrop.naturalWidth) {
      const zoom = Math.max(R.W / broadcastBackdrop.naturalWidth, R.H / broadcastBackdrop.naturalHeight) *
        (still ? 1 : 1 + elapsed * 0.032);
      const bw = Math.ceil(broadcastBackdrop.naturalWidth * zoom), bh = Math.ceil(broadcastBackdrop.naturalHeight * zoom);
      ctx.drawImage(broadcastBackdrop, Math.round((R.W - bw) / 2), Math.round((R.H - bh) / 2), bw, bh);
    }
    dim(0.70);
    const stripe = (sx, sy, width, height, slant, color) => {
      ctx.fillStyle = color;
      for (let row = 0; row < height; row += 3) {
        ctx.fillRect(sx + Math.round(row * slant), sy + row, width, Math.min(3, height - row));
      }
    };
    const travel = still ? 0 : Math.floor(elapsed * 47);
    stripe(-42 + travel % 61, y - 22, 30, 186, -0.53, '#a53a47a0');
    stripe(R.W - 6 - travel % 53, y - 14, 22, 178, -0.53, '#e5a7597a');

    if (elapsed < MATCH_INTRO_ENTRANCE) {
      const arrive = ease(elapsed / 0.44);
      const nameScale = w >= 350 ? 5 : 3;
      const band = textWidth(BROADCAST_NAME, nameScale) + 36;
      const identX = Math.round(cx - band / 2 - (1 - arrive) * w * 0.62);
      stripe(identX - 5, cy - 32, band + 15, 62, -0.28, '#e9c895');
      stripe(identX, cy - 30, band + 5, 58, -0.28, '#871f34');
      stripe(identX + Math.round(arrive * 50) - 22, cy - 28, 16, 54, -0.28, '#bc3e4d');
      blitText(ctx, BROADCAST_NAME, identX + band / 2 - 3, cy - Math.floor(nameScale * 7 / 2), '#fff2d0', nameScale, 'center', '#380e20');
      blitText(ctx, 'FUTEBOL UNIVERSITÁRIO', cx, cy + 47, '#f9d8a2', 1, 'center', '#091826');
    } else if (matchupTime < 0) {
      drawTeamsEntering(s, elapsed - MATCH_INTRO_ENTRANCE, cy, still);
    } else {
      const teamW = Math.floor((w - 38) / 2);
      const teamBanner = (team, home) => {
        const slide = still ? 0 : Math.round((1 - ease((matchupTime - (home ? 0 : 0.12)) / 0.57)) * (w / 2 + 22));
        const left = home ? x - slide : x + w - teamW + slide;
        const top = y + 32;
        const base = mix(team.primary, '#19253d', 0.62);
        const trim = mix(team.primary, '#ffdd95', 0.42);
        const center = left + Math.floor(teamW / 2);
        box(left, top, teamW, 104, base, '#be9265', null);
        ctx.save();
        ctx.beginPath(); ctx.rect(left + 2, top + 2, teamW - 4, 78); ctx.clip();
        stripe(left + (home ? 18 : teamW - 36), top, 42, 81, -0.56, mix(base, '#242031', 0.46));
        stripe(left + teamW / 2 - 28, top, 6, 81, -0.56, mix(base, trim, 0.48));
        const shine = still ? -120 : Math.round((matchupTime - 0.28) * (teamW + 122));
        stripe(left + shine, top, 13, 81, -0.45, '#ffdb972f');
        ctx.restore();
        ctx.fillStyle = trim; ctx.fillRect(left + 2, top + 2, teamW - 4, 2);
        if (!paintTeamLogo(ctx, logoAtlas, team, center - 28, top + 11, 56)) {
          blitText(ctx, team.short, center, top + 28, '#fff2d8', 3, 'center', '#0f1929');
        }
        ctx.fillStyle = '#0c1424'; ctx.fillRect(left + 2, top + 77, teamW - 4, 25);
        const name = [fullName(team), team.name, team.short].find((label) => textWidth(label) <= teamW - 10);
        blitText(ctx, name || team.short, center, top + 86, '#fff4dc', 1, 'center', '#101c2a');
      };
      teamBanner(s.home, true);
      teamBanner(s.away, false);
      box(x, y, w, 26, '#17253b', '#eac88c', null);
      ctx.fillStyle = '#8c2639'; ctx.fillRect(x + 2, y + 2, 67, 22);
      blitText(ctx, BROADCAST_NAME, x + 36, y + 9, '#fff3d8', 1, 'center', '#371020');
      blitText(ctx, 'FUTEBOL UNIVERSITÁRIO', x + 70 + (w - 70) / 2, y + 9, '#ffe8be', 1, 'center', '#141c2d');
      const impact = still ? 0 : Math.round((1 - ease((matchupTime - 0.22) / 0.27)) * 16);
      stripe(cx - 15, y + 65 - impact, 29, 22, -0.32, '#f2c98e');
      stripe(cx - 13, y + 67 - impact, 25, 18, -0.32, '#222136');
      blitText(ctx, 'VS', cx - 4, y + 72 - impact, '#ffe9bf', 1, 'center', null);
      blitText(ctx, WEATHER[s.weather].label, cx, y + 146, '#f8d8a0', 1, 'center', '#091826');
    }

    const bottom = Math.min(R.H - 17, cy + 91);
    blitText(ctx, touch ? 'TOQUE PARA PULAR' : 'ESPAÇO PARA PULAR', cx, bottom - 9, '#fff2d9', 1, 'center', '#0c1525');
    ctx.fillStyle = '#c9905c';
    ctx.fillRect(x, bottom + 3, Math.max(0, Math.floor(w * (1 - elapsed / MATCH_INTRO_SECONDS))), 2);
    ctx.restore();
  }

  function draw(s, dt, o = {}) {
    time += dt;
    hypeT = Math.max(0, hypeT - dt);
    flashT = Math.max(0, flashT - dt);
    buttons = [];
    const inScene = s.mode !== 'watch' && ['playcall', 'defcall', 'choice'].includes(s.phase) && !s.simulating;
    if (s.phase !== lastPhase) { lastPhase = s.phase; if (inScene) banners.length = 0; else selection.scene = ''; }
    updateCamera(s, dt, o.mode);
    updateParticles(dt * (s.timeScale ?? 1));
    drawProjectedWorld(s, dt, o);
    if (o.intro != null) { drawMatchIntro(s, o.intro, o.touch); return; }
    if (o.playCutIn) { drawPlayCutIn(o.playCutIn, o.touch); drawScreenParticles(); return; }
    if (o.broadcastBreak && !o.reaction) { drawBroadcastBreak(s, o.broadcastBreak, o.touch); return; }
    const match = o.mode === 'match';
    const qteShot = match && !s.simulating && Boolean(s.qte);
    const kickShot = match && s.mode !== 'watch' && !s.simulating && (s.phase === 'kick' || (s.phase === 'kickoff' && s.kickoff.kicking === 'home'));
    const lb = qteShot || kickShot ? clamp(Math.round(R.H * 0.11), 20, 46) : 0;
    letterbox += (lb - letterbox) * (reducedMotion.matches ? 1 : Math.min(1, dt * 10));
    if (match) {
      if (!qteShot && !kickShot) hud(s, o);
      if (!inScene && !o.reaction) drawBanners(dt, qteShot || kickShot);
    }
    if (!o.reaction) drawScreenParticles();
    if (flashT > 0) { ctx.fillStyle = `rgba(255,248,220,${(flashT / 0.12) * 0.3})`; ctx.fillRect(0, 0, R.W, R.H); }
    if (o.reaction) { drawScoreCutaway(s, o.reaction, o.touch); drawScreenParticles(); }
    else if (qteShot || kickShot || letterbox > 0.5) {
      if (qteShot) qteOverlay(s.qte, o.touch);
      if (kickShot) kickMeter(s, o.touch);
      const barH = Math.round(letterbox);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, R.W, barH);
      ctx.fillRect(0, R.H - barH, R.W, barH);
      if (qteShot || kickShot) pauseButton();
    }
  }

  return {
    canvas, resize, draw, toCanvas, screenToWorld, hit, banner, confetti, syncPlaybook, selectPlayTab, movePlaybook,
    get W() { return R.W; }, get H() { return R.H; }, get scale() { return R.scale; },
    setPointer(x, y) { pointer = { x, y }; },
    shake(amount = 2, t = 0.2) { shakeAmp = amount; shakeT = t; },
    hype(t = 3) { hypeT = t; },
    flash() { flashT = 0.12; },
    dust(x, y, n = 6) { spawnDust(x, y, n); },
    selection, resetCamera() { cam.ready = false; anims.clear(); kickTrail.length = 0; selection.scene = ''; pointer = { x: -1, y: -1 }; },
  };
}

  ui.classList.toggle('hidden', inMatch);

function localizeMenu(root) {
  if (app.settings.language !== 'en') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.parentElement.namespaceURI === 'http://www.w3.org/1999/xhtml') node.data = localize(node.data);
  }
  for (const node of root.querySelectorAll('[aria-label], [title], optgroup[label]')) {
    for (const key of ['aria-label', 'title', 'label']) if (node.hasAttribute(key)) node.setAttribute(key, localize(node.getAttribute(key)));
  }
}

  championshipSetup: championshipSetupScreen,

  challenge: challengeScreen,
  challenges: challengeAcademyScreen,
